# Release pipeline for Documental — push a tag "v*" (e.g. v1.2.3) to trigger.
# Builds Windows (NSIS + portable), Linux (AppImage, deb, rpm + best-effort snap) and macOS
# (dmg + zip, x64 only), publishing all artifacts to a DRAFT GitHub release for manual review.
# Requires the GH_CLIENT_ID secret and the THEME/THEME_MODE values (repo Settings → Secrets and variables → Actions);
# theme values are required and verified against the packaged runtime env after each build.
# Git providers: scoped vitest suites run per provider before packaging, and
# `npm run verify:bundled-git` checks the dugite binaries inside dist/ after each build.
# manual runs from the Actions tab are build-only (no publish, no version change).
# Future code signing placeholders — never enable on unsigned builds (notarization fails hard):
#   CSC_LINK / CSC_KEY_PASSWORD (Windows + macOS certificates)
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_TEAM_ID (macOS notarization)

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-create the draft release idempotently. This eliminates the duplicate-draft
      # race in electron-builder 26.15.3 (issue #10026): every publisher leg below
      # finds the existing draft instead of racing to create one.
      - name: Ensure draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$TAG" --draft --title "$TAG" --notes "Documental $TAG" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    if: always() && !failure() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win -- $PUBLISH
          - os: ubuntu-latest
            build_cmd: npm run build:linux -- AppImage deb rpm $PUBLISH
          - os: macos-latest
            build_cmd: npm run build:macos -- $PUBLISH
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '--publish always' || '--publish never' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # `runner` context is invalid in job-level env; `github.workspace` is valid and keeps the cache next to the checkout.
      DUGITE_CACHE_DIR: ${{ github.workspace }}/.dugite-cache
      THEME: ${{ vars.THEME || secrets.THEME }}
      THEME_MODE: ${{ vars.THEME_MODE || secrets.THEME_MODE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-eb-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eb-

      - name: Cache dugite binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.DUGITE_CACHE_DIR }}
          key: ${{ runner.os }}-dugite-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dugite-

      - name: Install dependencies
        run: npm ci

      # Scoped test suites per git provider — NEVER the full `npm test` here:
      # it includes quarantined KNOWN-FAILURES that are unrelated to packaging.
      - name: Test (isomorphic-git)
        run: npx vitest run tests/ipc tests/git-providers tests/git-layer-boundary.test.js tests/build-scripts.test.js
        env:
          GIT_PROVIDER: isomorphic-git

      - name: Test (dugite)
        run: npx vitest run tests/git-providers
        env:
          GIT_PROVIDER: dugite

      # Must run BEFORE any build:* script — electron-builder.yml extraMetadata uses
      # $fromFile: electron-builder.env, so the file itself must exist on disk.
      # THEME/THEME_MODE are required (job env) and verified post-build.
      - name: Generate electron-builder.env
        shell: bash
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
        run: |
          if [ -z "$GITHUB_CLIENT_ID" ]; then
            echo "::error::Secret GH_CLIENT_ID is not configured in repo settings"
            exit 1
          fi
          printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID" > electron-builder.env
          if [ -z "$THEME" ] || [ -z "$THEME_MODE" ]; then
            echo "::error::THEME and THEME_MODE must be configured (repo Variables or Secrets). THEME='$THEME' THEME_MODE='$THEME_MODE'"
            exit 1
          fi
          printf 'THEME=%s\n' "$THEME" >> electron-builder.env
          printf 'THEME_MODE=%s\n' "$THEME_MODE" >> electron-builder.env
          echo "Theme configured: THEME=$THEME THEME_MODE=$THEME_MODE"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build and publish
        shell: bash
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs AFTER the build step: publishing happens inside the electron-builder
      # command above (--publish always), so this cannot gate the upload — instead
      # it fails the job loudly so a draft with a broken bundled Git is never
      # promoted for review. Default dist/ output matches electron-builder.
      - name: Verify bundled Git
        run: npm run verify:bundled-git

      # Same gating logic as above: fail the job if silent packaging drops
      # removed startup-critical files from app.asar (win-asar-packaging evidence).
      - name: Verify app.asar contents
        run: npm run verify:asar

      - name: Verify theme in runtime env
        shell: bash
        run: |
          ACTUAL_THEME=$(node -p "require('./resources/config/runtime-env.json').THEME || ''")
          ACTUAL_MODE=$(node -p "require('./resources/config/runtime-env.json').THEME_MODE || ''")
          echo "Packaged runtime env: THEME=$ACTUAL_THEME THEME_MODE=$ACTUAL_MODE (expected THEME=$THEME THEME_MODE=$THEME_MODE)"
          if [ "$ACTUAL_THEME" != "$THEME" ] || [ "$ACTUAL_MODE" != "$THEME_MODE" ]; then
            echo "::error::Theme did not reach the packaged runtime-env.json (got THEME='$ACTUAL_THEME' THEME_MODE='$ACTUAL_MODE')"
            exit 1
          fi

  snap:
    name: Build snap (best-effort)
    needs: prepare
    if: always() && !failure() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '--publish always' || '--publish never' }}
      # `runner` context is invalid in job-level env; `github.workspace` is valid and keeps the cache next to the checkout.
      DUGITE_CACHE_DIR: ${{ github.workspace }}/.dugite-cache
      THEME: ${{ vars.THEME || secrets.THEME }}
      THEME_MODE: ${{ vars.THEME_MODE || secrets.THEME_MODE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-eb-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eb-

      # Dugite cache only — scoped tests are intentionally skipped here:
      # the job is best-effort (continue-on-error), so test failures would be
      # silently absorbed anyway; the matrix build job is the test gate.
      - name: Cache dugite binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.DUGITE_CACHE_DIR }}
          key: ${{ runner.os }}-dugite-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dugite-

      - name: Install dependencies
        run: npm ci

      - name: Generate electron-builder.env
        shell: bash
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
        run: |
          if [ -z "$GITHUB_CLIENT_ID" ]; then
            echo "::error::Secret GH_CLIENT_ID is not configured in repo settings"
            exit 1
          fi
          printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID" > electron-builder.env
          if [ -z "$THEME" ] || [ -z "$THEME_MODE" ]; then
            echo "::error::THEME and THEME_MODE must be configured (repo Variables or Secrets). THEME='$THEME' THEME_MODE='$THEME_MODE'"
            exit 1
          fi
          printf 'THEME=%s\n' "$THEME" >> electron-builder.env
          printf 'THEME_MODE=%s\n' "$THEME_MODE" >> electron-builder.env
          echo "Theme configured: THEME=$THEME THEME_MODE=$THEME_MODE"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # The snap publisher override in the command below is MANDATORY:
      # snap's default publisher is the Snap Store, not GitHub Releases.
      - name: Build and publish snap
        shell: bash
        run: npm run build:linux:snap -- -c.snap.publish=github $PUBLISH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best-effort too (absorbed by continue-on-error), but still worth failing
      # visibly when the snap's bundled Git is broken.
      - name: Verify bundled Git
        run: npm run verify:bundled-git

      - name: Verify theme in runtime env
        shell: bash
        run: |
          ACTUAL_THEME=$(node -p "require('./resources/config/runtime-env.json').THEME || ''")
          ACTUAL_MODE=$(node -p "require('./resources/config/runtime-env.json').THEME_MODE || ''")
          echo "Packaged runtime env: THEME=$ACTUAL_THEME THEME_MODE=$ACTUAL_MODE (expected THEME=$THEME THEME_MODE=$THEME_MODE)"
          if [ "$ACTUAL_THEME" != "$THEME" ] || [ "$ACTUAL_MODE" != "$THEME_MODE" ]; then
            echo "::error::Theme did not reach the packaged runtime-env.json (got THEME='$ACTUAL_THEME' THEME_MODE='$ACTUAL_MODE')"
            exit 1
          fi
