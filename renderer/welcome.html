<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon-favicon.png"/>
    <title>Documental - Welcome</title>
<link href="./assets/css/fonts.css" rel="stylesheet"/>
<link href="./assets/css/compiled.css" rel="stylesheet"/>
<link href="./assets/css/theme-override.css" rel="stylesheet"/>
    <style>
        /* Subtle animated gradient background */
        .bg-scene {
            background:
                radial-gradient(ellipse 80% 60% at 50% 45%, rgba(from var(--color-primary) r g b / 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(from var(--color-primary) r g b / 0.03) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 20%, rgba(from var(--color-primary) r g b / 0.03) 0%, transparent 60%),
                var(--color-background-dark);
        }

        /* No height/min-height on html/body: 100vh/100% resolve against the
           UNZOOMED viewport while the shell compensates via --zoom, so any
           body min-height double-scales and spawns an outer document
           scrollbar (double-scrollbar bug). The .app-shell governs height. */
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            position: relative;
        }
        
        .main-content {
            padding-top: 8vh !important;
            min-height: calc(100vh - 120px);
        }
        
        @media (min-height: 800px) {
            .main-content {
                padding-top: 10vh !important;
            }
        }
        
        @media (min-height: 1000px) {
            .main-content {
                padding-top: 12vh !important;
            }
        }
        
        @media (min-height: 1200px) {
            .main-content {
                padding-top: 15vh !important;
            }
        }

        /* .app-scroll (flex:1 min-height:0) must win over the pre-existing
           .main-content min-height — calc(100vh - 120px) double-scales under
           zoom (100vh resolves unscaled) and would push the footer below the
           compensated shell at zoom > 100%. */
        .app-scroll.main-content {
            min-height: 0;
        }

[x-cloak] { display: none !important; }

        /* Entrance animations - matches language.html pattern */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .anim-logo {
            animation: fadeIn 0.6s ease-out both;
        }

        /* Hero logo (PNG) - matches language.html pattern */
        .app-logo-hero {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            border: 2px solid var(--color-border-default);
            object-fit: cover;
            box-shadow: 0 4px 24px rgba(from var(--color-primary) r g b / 0.2);
            background: var(--color-surface-card);
            display: block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .app-logo-hero:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 32px rgba(from var(--color-primary) r g b / 0.3);
        }

        .dark .app-logo-hero {
            border-color: var(--color-border-default);
            box-shadow: 0 4px 24px rgba(from var(--color-primary) r g b / 0.15);
        }
    </style>
</head>
<body class="bg-scene bg-background-dark text-text-dark antialiased">
    <div class="app-shell flex flex-col" x-data="welcomeWizard" x-cloak>
        <!-- Progress Bar -->
        <div class="h-1 bg-surface-dark">
            <div class="h-full welcome-gradient transition-all duration-500" :style="`width: ${progressPercent}%`"></div>
        </div>

        <!-- Theme picker - visible on all steps (top-right) -->
        <div class="absolute top-4 right-4 z-50 flex items-center gap-2">
            <span class="text-xs text-muted-dark font-medium hidden md:inline" x-text="__t('language.theme')"></span>
            <!-- Zoom controls -->
            <div id="zoom-controls" class="inline-flex items-center gap-1" style="padding:0.25rem;border-radius:0.5rem;background:var(--color-surface-dark);border:1px solid var(--color-border-subtle)">
                <button id="zoom-out" @click="zoomOut()" :disabled="zoomLevel <= 50" class="inline-flex items-center justify-center w-7 h-7 rounded-md text-muted-dark hover:text-text-dark transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed" aria-label="Zoom out">
                    <span class="material-symbols-outlined text-sm">zoom_out</span>
                </button>
                <button id="zoom-reset" @click="resetZoom()" class="inline-flex items-center justify-center w-7 h-7 rounded-md text-muted-dark hover:text-text-dark transition-all duration-200" aria-label="Reset zoom">
                    <span class="material-symbols-outlined text-sm">zoom_out_map</span>
                </button>
                <span id="zoom-level" x-text="zoomLevel + '%'" class="inline-flex items-center justify-center text-xs font-medium text-muted-dark" style="min-width:2.5rem;text-align:center">100%</span>
                <button id="zoom-in" @click="zoomIn()" :disabled="zoomLevel >= 200" class="inline-flex items-center justify-center w-7 h-7 rounded-md text-muted-dark hover:text-text-dark transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed" aria-label="Zoom in">
                    <span class="material-symbols-outlined text-sm">zoom_in</span>
                </button>
            </div>
            <div class="inline-flex items-center gap-0 p-1 rounded-lg bg-surface-dark border border-border-subtle">
                <button @click="selectTheme('auto')"
                        :class="selectedTheme === 'auto' ? 'bg-surface-card text-primary' : 'text-muted-dark hover:text-text-dark'"
                        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium transition-all duration-200"
                        :aria-label="__t('language.theme_auto')">
                    <span class="material-symbols-outlined text-base">contrast</span>
                </button>
                <button @click="selectTheme('dark')"
                        :class="selectedTheme === 'dark' ? 'bg-surface-card text-primary' : 'text-muted-dark hover:text-text-dark'"
                        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium transition-all duration-200"
                        :aria-label="__t('language.theme_dark')">
                    <span class="material-symbols-outlined text-base">dark_mode</span>
                </button>
                <button @click="selectTheme('light')"
                        :class="selectedTheme === 'light' ? 'bg-surface-card text-primary' : 'text-muted-dark hover:text-text-dark'"
                        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-medium transition-all duration-200"
                        :aria-label="__t('language.theme_light')">
                    <span class="material-symbols-outlined text-base">light_mode</span>
                </button>
            </div>
        </div>

        <!-- Branding (hidden on Step 1) -->
        <div x-show="currentStep !== 1" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
            <div class="brand-logo-3x">
                <img src="./assets/img/logo-documental.svg" alt="Documental" />
            </div>
        </div>

        <!-- Main Content -->
        <div class="app-scroll flex items-start justify-center main-content pb-4 px-4 md:px-8">
            <div class="w-full max-w-4xl">
                
                <!-- Step 1: Welcome -->
                <div x-show="currentStep === 1" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100" class="text-center fade-in relative">
                    <div class="mb-12">
                        <div class="anim-logo mb-6 flex justify-center">
                            <img class="app-logo-hero" src="./assets/img/logo-documental.svg" alt="Documental" />
                        </div>
                        <h1 class="text-5xl font-black text-text-dark mb-4" x-text="$store.i18n.t('welcome.title')"></h1>
                        <p class="text-xl text-muted-dark max-w-2xl mx-auto leading-relaxed whitespace-pre-line" x-text="$store.i18n.t('welcome.subtitle')">
                        </p>
                    </div>
 
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12 max-w-3xl mx-auto">
                        <div class="bg-surface-dark rounded-lg p-6 text-center">
                            <span class="material-symbols-outlined text-3xl text-primary mb-3">cloud_upload</span>
                            <h3 class="font-semibold text-text-dark mb-2" x-text="$store.i18n.t('welcome.step_card_github_title')"></h3>
                            <p class="text-sm text-muted-dark" x-text="$store.i18n.t('welcome.step_card_github_desc')"></p>
                        </div>
                        <div class="bg-surface-dark rounded-lg p-6 text-center">
                            <span class="material-symbols-outlined text-3xl text-primary mb-3">cloud_download</span>
                            <h3 class="font-semibold text-text-dark mb-2" x-text="$store.i18n.t('welcome.step_card_node_title')"></h3>
                            <p class="text-sm text-muted-dark" x-text="$store.i18n.t('welcome.step_card_node_desc')"></p>
                        </div>
                        <div class="bg-surface-dark rounded-lg p-6 text-center">
                            <span class="material-symbols-outlined text-3xl text-primary mb-3">workspaces</span>
                            <h3 class="font-semibold text-text-dark mb-2" x-text="$store.i18n.t('welcome.step_card_env_title')"></h3>
                            <p class="text-sm text-muted-dark" x-text="$store.i18n.t('welcome.step_card_env_desc')"></p>
                        </div>
                    </div>

                    <div class="flex justify-center gap-4" style="margin-top: 1rem;">
                        <button onclick="if(window.electronAPI&amp;&amp;window.electronAPI.navigateTo){window.electronAPI.navigateTo('language.html')}else{window.location.href='language.html'}"
                                class="bg-surface-secondary hover:bg-surface-dark text-text-dark font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-all duration-300 transform hover:scale-105"
                                style="border:1px solid var(--color-border-default);">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span x-text="$store.i18n.t('common.back') || 'Voltar'"></span>
                        </button>
                        <button @click="nextStep()"
                                class="bg-primary hover:bg-primary-hover text-white text-base font-semibold py-3 px-10 rounded-lg flex items-center gap-2 transition-all duration-300 transform hover:scale-105">
                            <span x-text="$store.i18n.t('welcome.start_setup')"></span>
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </div>

                    <div class="mt-12 text-center space-y-3">
                        <a href="#" @click.prevent="openExternal('https://documental.xyz/')"
                           class="inline-block text-base text-muted-dark hover:text-primary transition-colors">
                            www.documental.xyz
                        </a>
                        <div class="flex items-center justify-center gap-2 text-sm text-muted-dark">
                            <a href="#" @click.prevent="openExternal('https://documental.xyz/docs')"
                               class="hover:text-primary transition-colors" x-text="__t('welcome.install_guide_link')"></a>
                            <span>-</span>
                            <a href="#" @click.prevent="openExternal('https://documental.xyz/licenca')"
                               class="hover:text-primary transition-colors" x-text="__t('welcome.footer_link_license')"></a>
                        </div>
                    </div>
                </div>


                
                <div x-show="currentStep === 2" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100" class="text-center fade-in">
                    <div class="mb-8">
                       
                        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-surface-dark mb-6">
                            <svg class="w-12 h-12 text-text-dark" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                            </svg>
                        </div>
                        <h1 class="text-4xl font-black text-text-dark mb-4" x-text="$store.i18n.t('welcome.connect_github_title')"></h1>
                        <p class="text-xl text-muted-dark max-w-2xl mx-auto leading-relaxed whitespace-pre-line" x-text="$store.i18n.t('welcome.connect_github_subtitle')"></p>
                    </div>

                   

                    <div x-show="!isAuthenticated && !isAuthenticating && !isCreatingAccount" class="bg-surface-dark rounded-lg p-8 max-w-2xl mx-auto mb-8">
                        <div class="space-y-6">
                            <div class="flex items-start gap-4">
                                <span class="material-symbols-outlined text-primary text-xl mt-1">check_circle</span>
                                <div class="text-left">
                                    <h3 class="font-semibold text-text-dark mb-1" x-text="$store.i18n.t('welcome.secure_auth')"></h3>
                                    <p class="text-sm text-muted-dark whitespace-pre-line" x-text="$store.i18n.t('welcome.secure_auth_desc')"></p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <span class="material-symbols-outlined text-primary text-xl mt-1">check_circle</span>
                                <div class="text-left">
                                    <h3 class="font-semibold text-text-dark mb-1" x-text="$store.i18n.t('welcome.controlled_access')"></h3>
                                    <p class="text-sm text-muted-dark whitespace-pre-line" x-text="$store.i18n.t('welcome.controlled_access_desc')"></p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <span class="material-symbols-outlined text-primary text-xl mt-1">check_circle</span>
                                <div class="text-left">
                                    <h3 class="font-semibold text-text-dark mb-1" x-text="$store.i18n.t('welcome.automatic_data')"></h3>
                                    <p class="text-sm text-muted-dark whitespace-pre-line" x-text="$store.i18n.t('welcome.automatic_data_desc')"></p>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div x-show="!isAuthenticated && isAuthenticating && deviceCode" class="bg-surface-dark rounded-lg p-8 max-w-2xl mx-auto mb-8">
                        <div class="space-y-4">
                            <div class="flex items-center justify-center gap-3">
                                <span class="text-sm text-muted-dark" x-text="$store.i18n.t('welcome.access_code')"></span>
                                <code class="text-2xl font-mono font-bold tracking-wider text-primary select-all" x-text="deviceCode"></code>
                                <button @click="navigator.clipboard.writeText(deviceCode); deviceCodeCopied = true; setTimeout(() => deviceCodeCopied = false, 2000)"
                                        class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-surface-secondary hover:bg-surface-card text-text-dark transition-colors duration-200"
                                        :title="deviceCodeCopied ? $store.i18n.t('common.copied') : $store.i18n.t('common.copy')">
                                    <span class="material-symbols-outlined text-lg" x-text="deviceCodeCopied ? 'check' : 'content_copy'"></span>
                                </button>
                                <span class="text-sm text-muted-dark ml-4 tabular-nums" x-show="deviceCodeExpiresIn > 0"
                                      x-text="$store.i18n.t('welcome.expires_in', {time: formatCountdown(deviceCodeExpiresIn)})"></span>
                            </div>
                            <webview :src="verificationUri"
                                     class="w-full rounded-lg border border-border-subtle bg-background-dark"
                                     style="width: 100%; height: 400px; display: flex;"
                                     allowpopups>
                            </webview>
                        </div>
                    </div>

                    <div x-show="!isAuthenticated && isCreatingAccount" class="bg-surface-dark rounded-lg p-8 max-w-2xl mx-auto mb-8">
                        <webview src="https://github.com/signup"
                                 class="w-full rounded-lg border border-border-subtle bg-background-dark"
                                 style="width: 100%; height: 450px; display: flex;"
                                 allowpopups>
                        </webview>
                    </div>

                    <div x-show="!isAuthenticated && isAuthenticating && !deviceCode" class="bg-surface-card rounded-lg p-6 max-w-md mx-auto mb-8">
                        <div class="flex items-center gap-3">
                            <div class="animate-spin">
                                <span class="material-symbols-outlined text-primary">refresh</span>
                            </div>
                            <p class="text-sm text-muted-dark" x-text="$store.i18n.t('welcome.connecting')"></p>
                        </div>
                    </div>

                    
                    <div x-show="isAuthenticated" class="bg-surface-dark border border-border-subtle rounded-lg p-6 max-w-md mx-auto mb-8">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="material-symbols-outlined text-primary">check_circle</span>
                            <p class="text-sm text-primary" x-text="$store.i18n.t('welcome.auth_success')"></p>
                        </div>
                        <div x-show="userInfo" class="text-left">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <p class="text-sm text-muted-dark mb-2" x-text="$store.i18n.t('welcome.connected_as')"></p>
                                    <div class="flex items-center gap-3">
                                        <img x-show="userInfo.avatar_url" :src="userInfo.avatar_url" :alt="userInfo.name" class="w-10 h-10 rounded-full">
                                        <div>
                                            <p class="font-semibold text-text-dark" x-text="userInfo.name || userInfo.login"></p>
                                            <p class="text-sm text-muted-dark" x-text="userInfo.email"></p>
                                        </div>
                                    </div>
                                </div>
                                <button @click="logoutFromGitHub()"
                                        class="bg-danger hover:bg-danger-dark text-on-danger text-sm font-medium py-2 px-4 rounded-lg transition-colors duration-300 flex items-center gap-2">
                                    <span class="material-symbols-outlined text-lg">logout</span>
                                    <span x-text="$store.i18n.t('welcome.logout')"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>


                <div x-show="currentStep === 3" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100" class="text-center fade-in">
                    <div class="mb-10">
                        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-surface-dark mb-6">
                            <span class="material-symbols-outlined text-4xl text-primary">cloud_download</span>
                        </div>
                        <h1 class="text-4xl font-black text-text-dark mb-4" x-text="$store.i18n.t('welcome.download_nodejs_title')"></h1>
                        <p class="text-xl text-muted-dark max-w-2xl mx-auto leading-relaxed whitespace-pre-line" x-text="$store.i18n.t('welcome.download_nodejs_subtitle')">
                        </p>
                    </div>

                    <div class="bg-surface-dark rounded-lg p-6 max-w-2xl mx-auto mb-6 text-left">
                        <div class="flex items-start gap-4">
                            <span class="material-symbols-outlined text-primary text-3xl">verified_user</span>
                            <div>
                                <h3 class="text-lg font-semibold text-text-dark mb-2" x-text="$store.i18n.t('welcome.nodejs_lts')"></h3>
                                <p class="text-sm text-muted-dark mb-3 whitespace-pre-line" x-text="$store.i18n.t('welcome.nodejs_lts_desc')">
                                </p>
                                <ul class="list-disc list-inside text-sm text-muted-dark space-y-1">
                                    <li x-text="$store.i18n.t('welcome.no_prompts')"></li>
                                    <li x-text="$store.i18n.t('welcome.works_with_existing')"></li>
                                    <li x-text="$store.i18n.t('welcome.can_reinstall')"></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div x-show="isDetectingNode" class="bg-surface-dark rounded-lg p-6 max-w-md mx-auto mb-4">
                        <div class="flex items-center gap-3">
                            <div class="animate-spin">
                                <span class="material-symbols-outlined text-primary">refresh</span>
                            </div>
                            <p class="text-sm text-muted-dark" x-text="$store.i18n.t('welcome.detecting_node')"></p>
                        </div>
                    </div>

                    <template x-if="nodeDetectionResult && nodeDetectionResult.runtime && nodeDetectionResult.runtime.installed && nodeDetectionResult.runtime.isValid">
                        <div class="bg-surface-card border border-border-subtle rounded-lg p-6 max-w-xl mx-auto mb-4 text-left">
                            <div class="flex items-center gap-3 mb-3">
                                <span class="material-symbols-outlined text-success text-xl">check_circle</span>
                                <p class="font-medium text-success" x-text="$store.i18n.t('welcome.node_installed')"></p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <p class="text-xs uppercase text-muted-dark">Node.js</p>
                                    <p class="font-mono text-lg text-text-dark" x-text="`v${nodeDetectionResult.runtime.version}`"></p>
                                </div>
                                <div>
                                    <p class="text-xs uppercase text-muted-dark">npm</p>
                                    <p class="font-mono text-lg text-text-dark" x-text="nodeDetectionResult.runtime.npmVersion || $store.i18n.t('common.loading')"></p>
                                </div>
                                <div class="md:col-span-2">
                                    <p class="text-xs uppercase text-muted-dark">Path</p>
                                    <p class="text-sm text-muted-dark" x-text="nodeDetectionResult.runtime.nodePath"></p>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template x-if="nodeDetectionResult && (!nodeDetectionResult.runtime || !nodeDetectionResult.runtime.installed || !nodeDetectionResult.runtime.isValid)">
                        <div class="bg-yellow-900/20 border border-yellow-700 rounded-lg p-6 max-w-xl mx-auto mb-4 text-left">
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-outlined text-yellow-500 text-xl">info</span>
                                <p class="font-medium text-yellow-400" x-text="$store.i18n.t('welcome.node_not_downloaded')"></p>
                            </div>
                            <p class="text-sm text-muted-dark mt-3 whitespace-pre-line" x-text="$store.i18n.t('welcome.click_download')"></p>
                        </div>
                    </template>

                    <div x-show="nodeErrorMessage" class="bg-red-900/20 border border-red-700 rounded-lg p-4 max-w-xl mx-auto mb-4 text-left">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="material-symbols-outlined text-red-400">error</span>
                            <p class="text-red-200 font-medium" x-text="$store.i18n.t('welcome.error_check_node')"></p>
                        </div>
                        <p class="text-sm text-red-200" x-text="nodeErrorMessage"></p>
                    </div>

                    <div x-show="installingNode" class="bg-surface-dark rounded-lg p-5 max-w-xl mx-auto mb-4 text-left">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="animate-spin">
                                <span class="material-symbols-outlined text-primary">downloading</span>
                            </div>
                            <div>
                                <p class="text-sm text-text-dark font-medium" x-text="nodeInstallProgress?.message || $store.i18n.t('welcome.downloading_node')"></p>
                                <p class="text-xs text-muted-dark" x-text="typeof nodeInstallProgress?.percent === 'number' ? `${nodeInstallProgress.percent}%` : ''"></p>
                            </div>
                        </div>
                        <div class="w-full bg-surface-secondary rounded-full h-2 overflow-hidden">
                            <div class="h-full welcome-gradient transition-all duration-300" :style="`width: ${typeof nodeInstallProgress?.percent === 'number' ? nodeInstallProgress.percent : 10}%`"></div>
                        </div>
                    </div>

                    <div x-show="nodeInstallError" class="bg-red-900/20 border border-red-700 rounded-lg p-4 max-w-xl mx-auto mb-4 text-left">

                        <div class="flex items-center gap-2 mb-2">
                            <span class="material-symbols-outlined text-red-400">error</span>
                            <p class="text-red-300 font-medium" x-text="$store.i18n.t('welcome.node_install_failed')"></p>
                        </div>
                        <p class="text-sm text-red-200" x-text="nodeInstallError"></p>
                    </div>

                    <div x-show="nodeInstallSuccess" class="bg-surface-dark border border-border-subtle rounded-lg p-4 max-w-xl mx-auto mb-4 text-left">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-success">task_alt</span>
                            <p class="text-success text-sm" x-text="$store.i18n.t('welcome.node_download_success')"></p>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                    <div class="flex gap-4 justify-center">

                        <div x-show="currentStep === 2" class="flex gap-4 justify-center w-full flex-wrap">
                            <button @click="previousStep()" x-show="!isCreatingAccount" class="bg-surface-secondary hover:bg-surface-dark text-text-dark font-semibold py-3 px-6 rounded-lg transition-colors duration-300">
                                <span class="material-symbols-outlined align-middle mr-2">arrow_back</span>
                                <span x-text="$store.i18n.t('common.back')"></span>
                            </button>

                            <button @click="authenticateWithGitHub()"
                                    x-show="!isAuthenticated && !isAuthenticating && !isCreatingAccount"
                                    class="bg-primary hover:bg-primary-hover text-on-primary text-base font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-all duration-300 transform hover:scale-105">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                </svg>
                                <span x-text="$store.i18n.t('welcome.connect_with_github')"></span>
                            </button>

                            <button @click="isAuthenticating = false"
                                    x-show="!isAuthenticated && isAuthenticating"
                                    class="bg-surface-secondary hover:bg-surface-dark text-text-dark text-base font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-colors duration-300">
                                <span class="material-symbols-outlined">cancel</span>
                                <span x-text="$store.i18n.t('common.cancel')"></span>
                            </button>

                            <button @click="isCreatingAccount = true"
                                    x-show="!isAuthenticated && !isAuthenticating && !isCreatingAccount"
                                    class="bg-surface-secondary hover:bg-surface-dark text-text-dark text-base font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-all duration-300 transform hover:scale-105">
                                <span class="material-symbols-outlined">person_add</span>
                                <span x-text="$store.i18n.t('welcome.create_github_account_button')"></span>
                            </button>

                            <button @click="previousStep()"
                                    x-show="isCreatingAccount"
                                    class="bg-surface-secondary hover:bg-surface-dark text-text-dark font-semibold py-3 px-6 rounded-lg transition-colors duration-300">
                                <span class="material-symbols-outlined align-middle mr-2">arrow_back</span>
                                <span x-text="$store.i18n.t('common.back')"></span>
                            </button>

                            <button @click="isCreatingAccount = false"
                                    x-show="isCreatingAccount"
                                    class="bg-surface-secondary hover:bg-surface-dark text-text-dark text-base font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-colors duration-300">
                                <span class="material-symbols-outlined">cancel</span>
                                <span x-text="$store.i18n.t('common.cancel')"></span>
                            </button>

                            <button @click="isCreatingAccount = false; authenticateWithGitHub()"
                                    x-show="isCreatingAccount"
                                    class="bg-primary hover:bg-primary-hover text-on-primary text-base font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-all duration-300 transform hover:scale-105">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                </svg>
                                <span x-text="$store.i18n.t('welcome.login_now')"></span>
                            </button>

                            <button @click="nextStep()"
                                    x-show="isAuthenticated"
                                    class="bg-primary hover:bg-primary-hover text-on-primary text-base font-semibold py-3 px-8 rounded-lg flex items-center gap-2 transition-all duration-300 transform hover:scale-105">
                                <span x-text="$store.i18n.t('common.next')"></span>
                                <span class="material-symbols-outlined">arrow_forward</span>
                            </button>
                        </div>

                        <div x-show="currentStep === 3" class="flex flex-wrap gap-4 justify-center w-full">
                            <button @click="previousStep()" class="bg-surface-secondary hover:bg-surface-dark text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-300">
                                <span class="material-symbols-outlined align-middle mr-2">arrow_back</span>
                                <span x-text="$store.i18n.t('common.back')"></span>
                            </button>

                            <button @click="installManagedNode()" 
                                    x-show="shouldInstallRuntime()"
                                    :disabled="installingNode || isDetectingNode"
                                    class="bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-6 rounded-lg transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed">
                                <span class="material-symbols-outlined align-middle mr-2">download</span>
                                <span x-text="installingNode ? $store.i18n.t('welcome.installing') : $store.i18n.t('welcome.download_install_nodejs')"></span>
                            </button>

                            <button @click="detectNode()" 
                                    :disabled="isDetectingNode"
                                    class="bg-surface-secondary hover:bg-surface-dark text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-200 disabled:opacity-60 disabled:cursor-not-allowed">
                                <span x-text="$store.i18n.t('welcome.verify_again')"></span>
                            </button>

                            <button @click="finishWithAnimation()"
                                    x-show="runtimePronto()"
                                    class="bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-200">
                                <span x-text="$store.i18n.t('welcome.finish_setup')"></span>
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        <!-- Fixed footer intentionally empty (progress bar is at top; step label and dots removed) -->
        <div class="app-footer" aria-hidden="true"></div>

    </div>


    <script src="./i18n.js"></script>
<script src="./shared/i18n-apply.js"></script>
<script src="./shared/theme-init.js" defer></script>
<script src="./assets/js/alpine.min.js" defer></script>
    <script src="script.js" defer></script>
    <script>
        // Apply declarative data-i18n translations once i18n is ready and DOM is loaded.
        // Required so static data-i18n attributes (e.g. Yes/No/Create Account buttons) show text.
        document.addEventListener('DOMContentLoaded', function () {
            if (window.Documental && window.Documental.applyTranslations) {
                window.Documental.applyTranslations();
            }
        });
    </script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('welcomeWizard', () => ({
                currentStep: 1,
                totalSteps: 3,
                completing: false,
                selectedTheme: 'auto',
                isAuthenticating: false,
                isAuthenticated: false,
                userInfo: null,
                deviceCode: null,
                verificationUri: null,
                deviceCodeCopied: false,
                deviceCodeExpiresIn: 0,
                deviceCodeTimer: null,
                isCreatingAccount: false,
                hasAccountChoice: null, // null | 'yes' | 'no'
                // Node.js detection properties
                isDetectingNode: false,
                nodeDetectionResult: null,
                nodeErrorMessage: null,
                nodeInstallError: null,
                nodeInstallSuccess: false,
                nodeInstallProgress: null,
                installingNode: false,
                
                // Setup completion tracking
                setupCompleted: false,

                // Zoom controls
                zoomLevel: 100,

                init() {
                    document.title = __t('welcome.page_title');

                    this.checkAuthenticationStatus();
                    this.initTheme();
                    this.initZoom();

                    if (window.electronAPI && window.electronAPI.onThemeChange) {
                        window.electronAPI.onThemeChange(({ resolvedMode, rawMode }) => {
                            if (rawMode === 'auto' && resolvedMode) {
                                this.applyThemeClass(resolvedMode);
                                if (window.electronAPI && window.electronAPI.setThemeMode) {
                                    window.electronAPI.setThemeMode('auto').then(result => {
                                        if (result && result.css) {
                                            let el = document.getElementById('__theme_injected');
                                            if (!el) {
                                                el = document.createElement('style');
                                                el.id = '__theme_injected';
                                                document.head.appendChild(el);
                                            }
                                            el.textContent = result.css;
                                        }
                                    });
                                }
                            }
                        });
                    }

                    if (window.electronAPI && window.electronAPI.onNodeInstallProgress) {
                        window.electronAPI.onNodeInstallProgress((progress) => {
                            this.nodeInstallProgress = progress;
                        });
                    }
                },

                get progressPercent() {
                    if (this.completing) return 100;
                    return ((this.currentStep - 1) / 3) * 100;
                },

                async finishWithAnimation() {
                    this.completing = true;
                    await new Promise(resolve => setTimeout(resolve, 650));
                    await this.completeSetup();
                },

                applyThemeClass(mode) {
                    let shouldBeDark;
                    if (mode === 'auto') {
                        shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    } else {
                        shouldBeDark = mode === 'dark';
                    }
                    document.documentElement.classList.toggle('dark', shouldBeDark);
                },

                async initTheme() {
                    if (window.electronAPI && window.electronAPI.getThemeMode) {
                        const r = await window.electronAPI.getThemeMode();
                        if (r.success) {
                            this.selectedTheme = r.mode;
                            let effectiveMode = r.resolvedMode || r.mode;
                            if (r.mode === 'auto' && window.electronAPI.getOsDarkPreference) {
                                const pref = await window.electronAPI.getOsDarkPreference();
                                if (pref && pref.success) {
                                    effectiveMode = pref.prefersDark ? 'dark' : 'light';
                                }
                            }
                            this.applyThemeClass(effectiveMode);
                        }
                    }
                },

                async selectTheme(mode) {
                    this.selectedTheme = mode;
                    if (window.electronAPI && window.electronAPI.setThemeMode) {
                        const result = await window.electronAPI.setThemeMode(mode);
                        if (result && result.css) {
                            let el = document.getElementById('__theme_injected');
                            if (!el) {
                                el = document.createElement('style');
                                el.id = '__theme_injected';
                                document.head.appendChild(el);
                            }
                            el.textContent = result.css;
                        }
                        let effectiveMode = (result && result.resolvedMode) || mode;
                        if (mode === 'auto' && window.electronAPI.getOsDarkPreference) {
                            const pref = await window.electronAPI.getOsDarkPreference();
                            if (pref && pref.success) {
                                effectiveMode = pref.prefersDark ? 'dark' : 'light';
                            }
                        }
                        this.applyThemeClass(effectiveMode);
                    } else {
                        this.applyThemeClass(mode);
                    }
                },

                nextStep() {
                    if (this.currentStep < this.totalSteps) {
                        this.currentStep++;
                        
                        // Check Node.js installation when moving to step 4
                        if (this.currentStep === 3) {
                            this.detectNode();
                        }
                    }
                },

                previousStep() {
                    if (this.currentStep > 1) {
                        this.currentStep--;
                    }
                },

                openExternal(url) {
                    if (window.electronAPI && window.electronAPI.openExternal) {
                        window.electronAPI.openExternal(url);
                    } else {
                        window.open(url, '_blank');
                    }
                },

                runtimePronto() {
                    const runtime = this.nodeDetectionResult?.runtime;
                    return !!(runtime && runtime.installed && runtime.isValid);
                },

                shouldInstallRuntime() {
                    const runtime = this.nodeDetectionResult?.runtime;
                    return !runtime || !runtime.installed || !runtime.isValid;
                },

                async checkAuthenticationStatus() {
                    try {
                        if (window.electronAPI && window.electronAPI.checkGitHubAuth) {
                            const authStatus = await window.electronAPI.checkGitHubAuth();
                            if (authStatus.authenticated) {
                                this.isAuthenticated = true;
                                this.userInfo = authStatus.userInfo;
                            }
                        }
                    } catch (error) {
                        console.error('Error checking authentication status:', error);
                    }
                },

                async authenticateWithGitHub() {
                    this.isAuthenticating = true;
                    this.deviceCode = null;
                    this.verificationUri = null;
                    this.deviceCodeExpiresIn = 0;
                    try {
                        if (window.electronAPI && window.electronAPI.authenticateWithGitHub) {
                            const result = await window.electronAPI.authenticateWithGitHub();

                            if (result.requiresDeviceCode) {
                                this.deviceCode = result.deviceCode;
                                this.verificationUri = result.verificationUri;
                                this.startDeviceCodeTimer(result.expiresIn);

                                const authResult = await window.electronAPI.continueGitHubAuth(
                                    result.deviceCodeInternal,
                                    result.interval
                                );

                                this.stopDeviceCodeTimer();

                                if (authResult.success) {
                                    this.isAuthenticated = true;
                                    this.userInfo = authResult.userInfo;
                                    this.deviceCode = null;
                                    this.verificationUri = null;
                                } else {
                                    alert(__t('welcome.error_auth', {error: authResult.error}));
                                }
                            } else if (result.success) {
                                this.isAuthenticated = true;
                                this.userInfo = result.userInfo;
                            } else {
                                alert(__t('welcome.error_auth', {error: result.error}));
                            }
                        } else {
                            alert(__t('welcome.error_auth_api'));
                        }
                    } catch (error) {
                        alert(__t('welcome.error_auth', {error: error.message}));
                    } finally {
                        this.stopDeviceCodeTimer();
                        this.isAuthenticating = false;
                        this.deviceCode = null;
                        this.verificationUri = null;
                    }
                },

                startDeviceCodeTimer(expiresIn) {
                    this.deviceCodeExpiresIn = expiresIn;
                    this.stopDeviceCodeTimer();
                    this.deviceCodeTimer = setInterval(() => {
                        this.deviceCodeExpiresIn--;
                        if (this.deviceCodeExpiresIn <= 0) {
                            this.stopDeviceCodeTimer();
                            this.isAuthenticating = false;
                            this.deviceCode = null;
                            this.verificationUri = null;
                        }
                    }, 1000);
                },

                stopDeviceCodeTimer() {
                    if (this.deviceCodeTimer) {
                        clearInterval(this.deviceCodeTimer);
                        this.deviceCodeTimer = null;
                    }
                },

                formatCountdown(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return m + ':' + String(s).padStart(2, '0');
                },

                async completeSetup() {
                    try {
                        if (window.electronAPI && window.electronAPI.completeWelcomeSetup) {
                            const result = await window.electronAPI.completeWelcomeSetup();
                            
                            if (result && result.success) {
                                console.log('✅ Setup completed successfully, navigating to main screen');
                                window.electronAPI.navigateTo('index.html');
                            } else {
                                throw new Error(result?.error || __t('welcome.error_setup_mark'));
                            }
                        } else {
                            throw new Error(__t('welcome.error_setup_api'));
                        }
                    } catch (error) {
                        console.error('Error completing setup:', error);
                        alert(__t('welcome.error_finish_setup', {error: error.message}));
                    }
                },

                /**
                 * Logout from GitHub
                 */
                async logoutFromGitHub() {
                    try {
                        console.log('🔘 Logging out from GitHub...');
                        
                        if (window.electronAPI && window.electronAPI.logoutFromGitHub) {
                            const result = await window.electronAPI.logoutFromGitHub();
                            
                            if (result.success) {
                                console.log('✅ Successfully logged out from GitHub');
                                this.isAuthenticated = false;
                                this.userInfo = null;
                                
                                // Show success message briefly
                                const successDiv = document.createElement('div');
                                successDiv.className = 'fixed top-4 right-4 bg-primary text-white px-6 py-3 rounded-lg shadow-lg z-50';
                                successDiv.innerHTML = `
                                    <div class="flex items-center gap-2">
                                        <span class="material-symbols-outlined">check_circle</span>
                                        <span>${__t('welcome.disconnected_success')}</span>
                                    </div>
                                `;
                                document.body.appendChild(successDiv);
                                
                                // Remove success message after 3 seconds
                                setTimeout(() => {
                                    if (successDiv.parentNode) {
                                        successDiv.parentNode.removeChild(successDiv);
                                    }
                                }, 3000);
                            } else {
                                console.error('❌ Failed to logout from GitHub:', result.error);
                                alert(__t('welcome.error_logout', {error: result.error}));
                            }
                        } else {
                            console.error('❌ Logout API not available');
                            alert(__t('welcome.error_logout_api'));
                        }
                    } catch (error) {
                        console.error('💥 Logout error:', error);
                        alert(__t('welcome.error_logout', {error: error.message}));
                    }
                },

                // Node.js related methods
                async detectNode() {
                    this.isDetectingNode = true;
                    this.nodeErrorMessage = null;

                    try {
                        if (window.electronAPI && window.electronAPI.detectNode) {
                            const result = await window.electronAPI.detectNode();
                            console.log('Node.js detection result:', result);
                            
                            if (result.error) {
                                throw new Error(result.error);
                            }

                            this.nodeDetectionResult = result;
                        } else {
                            throw new Error(__t('welcome.error_detect_api'));
                        }
                    } catch (error) {
                        console.error('Error detecting Node.js:', error);
                        this.nodeErrorMessage = __t('welcome.error_detect', {error: error.message});
                        this.nodeDetectionResult = null;
                    } finally {
                        this.isDetectingNode = false;
                    }
                },

                async installManagedNode() {
                    try {
                        if (!window.electronAPI || !window.electronAPI.installManagedNode) {
                            throw new Error(__t('welcome.error_install_api'));
                        }

                        this.nodeInstallError = null;
                        this.nodeInstallSuccess = false;
                        this.installingNode = true;
                        this.nodeInstallProgress = { stage: 'starting', percent: 5, message: __t('welcome.preparing_download') };

                        const result = await window.electronAPI.installManagedNode();
                        if (!result.success) {
                            throw new Error(result.error || __t('welcome.error_install_node'));
                        }

                        this.nodeInstallSuccess = true;
                        this.nodeInstallProgress = { stage: 'completed', percent: 100, message: __t('welcome.install_complete') };
                        await this.detectNode();
                    } catch (error) {
                        console.error('Error installing managed Node.js:', error);
                        this.nodeInstallError = error.message;
                    } finally {
                        this.installingNode = false;
                    }
                },

                // Zoom methods
                initZoom() {
                    var stored = sessionStorage.getItem('zoom-level');
                    this.zoomLevel = stored ? parseInt(stored, 10) : 100;
                    if (this.zoomLevel < 50) this.zoomLevel = 50;
                    if (this.zoomLevel > 200) this.zoomLevel = 200;
                    this.applyZoom();
                },

                zoomIn() {
                    if (this.zoomLevel < 200) {
                        this.zoomLevel += 25;
                        this.applyZoom();
                    }
                },

                zoomOut() {
                    if (this.zoomLevel > 50) {
                        this.zoomLevel -= 25;
                        this.applyZoom();
                    }
                },

                resetZoom() {
                    this.zoomLevel = 100;
                    this.applyZoom();
                },

                applyZoom() {
                    document.body.style.zoom = (this.zoomLevel / 100).toString();
                    document.documentElement.style.setProperty('--zoom', String(this.zoomLevel / 100));
                    sessionStorage.setItem('zoom-level', this.zoomLevel.toString());
                },
            }));
        });
    </script>
    <script src="./shared/zoom.js"></script>
