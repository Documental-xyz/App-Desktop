<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title x-text="__t('create.page_title')">Creating Workspace</title>
<link href="./assets/css/fonts.css" rel="stylesheet"/>
<link href="./assets/css/compiled.css" rel="stylesheet"/>
<link href="./assets/css/theme-override.css" rel="stylesheet"/>
<style>
        .creative-loader {
            width: 50px;
            height: 50px;
            position: relative;
        }
        .creative-loader::before, .creative-loader::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 6px solid transparent;
            border-top-color: var(--color-primary);
            animation: spin-creative 1.5s ease-in-out infinite;
        }
        .creative-loader::after {
            border-top-color: var(--color-info);
            animation-delay: 0.3s;
            animation-direction: reverse;
        }
        @keyframes spin-creative {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.8); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .creative-loader.paused::before,
        .creative-loader.paused::after {
            animation-play-state: paused;
        }
        .step-icon-active {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
        .repo-header { padding-top: 12vh !important; }
        @media (min-height: 800px) { .repo-header { padding-top: 15vh !important; } }
        @media (min-height: 1000px) { .repo-header { padding-top: 18vh !important; } }
        @media (min-height: 1200px) { .repo-header { padding-top: 22vh !important; } }
        /* Theme picker (top-right) */
        .theme-picker {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .theme-picker-group {
            display: inline-flex;
            align-items: center;
            gap: 0;
            padding: 0.25rem;
            border-radius: 0.5rem;
            background: var(--color-surface-dark);
            border: 1px solid var(--color-border-subtle);
        }
        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--color-muted-dark, var(--color-text-dark));
        }
        .theme-btn:hover {
            color: var(--color-text-dark);
        }
        .theme-btn.active {
            background: var(--color-surface-card);
            color: var(--color-primary);
        }
        .theme-btn .material-symbols-outlined {
            font-size: 1rem;
        }
    </style>
<script src="./i18n.js"></script>
<script src="./shared/i18n-apply.js"></script>
<script defer src="./assets/js/alpine.min.js"></script>
<script src="./shared/logo.js"></script>
<script src="./shared/footer.js"></script>
<script src="script.js" defer></script>
</head>
<body class="bg-background-dark text-text-dark antialiased">
<!-- Theme picker (top-right) -->
<div class="theme-picker">
    <div class="theme-picker-group">
        <button class="theme-btn" data-theme="auto" aria-label="Auto theme">
            <span class="material-symbols-outlined">contrast</span>
        </button>
        <button class="theme-btn" data-theme="dark" aria-label="Dark theme">
            <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <button class="theme-btn" data-theme="light" aria-label="Light theme">
            <span class="material-symbols-outlined">light_mode</span>
        </button>
    </div>
</div>
<div class="flex flex-col h-screen" x-data="{
        projectId: null,
        projectPath: '',
        githubUrl: '',
        projectName: '',
        repoFolderName: '',
        activeStepId: 1,
        processFinished: false,
        processFailed: false,
        processPaused: false,
        enablePages: false,
        steps: [
            { id: 0, title: __t('create.step_fork'), status: 'pending', log: '', expanded: false },
            { id: 6, title: __t('create.step_pages'), status: 'pending', log: '', expanded: false },
            { id: 1, title: __t('create.step_git_clone'), status: 'pending', log: '', expanded: false },
            { id: 2, title: __t('create.step_branch_preview'), status: 'pending', log: '', expanded: false },
            { id: 3, title: __t('create.step_dependencies'), status: 'pending', log: '', expanded: false },
            { id: 4, title: __t('create.step_build'), status: 'pending', log: '', expanded: false },
            { id: 5, title: __t('create.step_dev_server'), status: 'pending', log: '', expanded: false }
        ],
        get allStepsSuccess() {
            return this.steps.every(s => s.status === 'success');
        },
        get anyStepFailed() {
            return this.steps.some(s => s.status === 'failure');
        },
        init() {
            // Watch for process pause
            this.$watch('processPaused', (value) => {
                if (value) {
                    console.log('Process paused');
                }
            });
            
            this.projectId = sessionStorage.getItem('currentProjectId');
            this.isReopenMode = sessionStorage.getItem('reopenMode') === 'true';
            this.isExistingGitRepo = sessionStorage.getItem('isExistingGitRepo') === 'true';
            this.isEmptyFolder = sessionStorage.getItem('isEmptyFolder') === 'true';
            this.shouldForkFirst = sessionStorage.getItem('shouldForkFirst') === 'true';
            this.projectName = sessionStorage.getItem('projectName') || '';
            this.enablePages = sessionStorage.getItem('enableGitHubPages') === 'true';
            
            if (!this.projectId) {
                console.error('No project ID found in session storage.');
                this.processFailed = true;
                return;
            }

            const savedState = JSON.parse(sessionStorage.getItem(`projectCreationState-${this.projectId}`));
            if (savedState && savedState.schemaVersion === 2) {
                Object.assign(this.$data, savedState);
            } else if (this.isReopenMode) {
                this.steps[0].status = 'success';
                this.steps[1].status = 'success';
                this.steps[2].status = 'success';
                this.steps[3].status = 'success';
                this.steps[4].status = 'success';
                this.steps[5].status = 'active';
                this.activeStepId = 4;
            } else if (this.isExistingGitRepo) {
                this.steps[0].status = 'success';
                this.steps[1].status = 'success';
                this.steps[2].status = 'success';
                this.steps[2].title = __t('create.step_git_found');
                this.steps[3].status = 'active';
                this.activeStepId = 2;
            } else if (this.isEmptyFolder) {
                if (this.shouldForkFirst) {
                    this.steps[0].status = 'active';
                    this.activeStepId = 0;
                } else if (this.enablePages) {
                    this.steps[0].status = 'success';
                    this.steps[1].status = 'active';
                    this.activeStepId = 6;
                } else {
                    this.steps[0].status = 'success';
                    this.steps[1].status = 'success';
                    this.steps[2].title = __t('create.step_cloning_folder');
                    this.steps[2].status = 'active';
                    this.activeStepId = 1;
                }
            } else {
                if (this.shouldForkFirst) {
                    this.steps[0].status = 'active';
                    this.activeStepId = 0;
                } else if (this.enablePages) {
                    this.steps[0].status = 'success';
                    this.steps[1].status = 'active';
                    this.activeStepId = 6;
                } else {
                    this.steps[0].status = 'success';
                    this.steps[1].status = 'success';
                    this.steps[2].status = 'active';
                    this.activeStepId = 1;
                }
            }

            this.$watch('steps', (newSteps) => {
                sessionStorage.setItem(`projectCreationState-${this.projectId}`, JSON.stringify({
                    schemaVersion: 2,
                    projectId: this.projectId,
                    projectPath: this.projectPath,
                    githubUrl: this.githubUrl,
                    repoFolderName: this.repoFolderName,
                    activeStepId: this.activeStepId,
                    processFinished: this.processFinished,
                    processFailed: this.processFailed,
                    steps: newSteps
                }));
            }, { deep: true });

            // Removed activeStepId watcher to allow expanding completed steps

            window.electronAPI.onCommandOutput((payload) => {
                const normalized = typeof payload === 'object' && payload !== null
                    ? { stepId: payload.stepId || null, message: payload.message || '' }
                    : { stepId: null, message: payload || '' };
                if (!normalized.message) {
                    return;
                }
                const targetIndex = normalized.stepId !== null && normalized.stepId !== undefined
                    ? this.steps.findIndex(s => s.id === normalized.stepId)
                    : this.steps.findIndex(s => s.status === 'active');
                if (targetIndex !== -1) {
                    this.steps[targetIndex].log += normalized.message;
                }
            });

            window.electronAPI.onCommandStatus((payload) => {
                const normalized = typeof payload === 'object' && payload !== null
                    ? { stepId: payload.stepId || null, status: payload.status || '' }
                    : { stepId: null, status: payload };
                const targetIndex = normalized.stepId !== null && normalized.stepId !== undefined
                    ? this.steps.findIndex(s => s.id === normalized.stepId)
                    : this.steps.findIndex(s => s.status === 'active');
                if (targetIndex !== -1) {
                    if (normalized.status === 'success') {
                        this.steps[targetIndex].status = 'success';
                        const nextIndex = this.steps.findIndex((step, index) => index > targetIndex && step.status === 'pending');
                        if (nextIndex !== -1) {
                            this.steps[nextIndex].status = 'active';
                            this.activeStepId = this.steps[nextIndex].id;
                        } else {
                            this.processFinished = true;
                        }
                    } else if (normalized.status === 'failure') {
                        this.steps[targetIndex].status = 'failure';
                        this.processFinished = true;
                        this.processFailed = true;
                    } else if (normalized.status === 'cancelled') {
                        this.processFinished = true;
                        this.processFailed = true; // Mark as failed for UI purposes
                        this.steps[targetIndex].log += '\n' + __t('create.process_cancelled');
                    }
                }
                // Special handling for the last step (npm run dev)
                // If the last step is active, consider the process finished from a UI perspective
                // to allow the user to proceed, as dev servers typically run indefinitely.
                if (this.steps[this.steps.length - 1].status === 'active') {
                    this.processFinished = true;
                }
            });

            window.electronAPI.onDevServerUrl((url) => {
                sessionStorage.setItem('devServerUrl', url);
                console.log('Dev server URL saved to session storage:', url);
            });

            window.electronAPI.onServerOutput((payload) => {
                const normalized = typeof payload === 'object' && payload !== null
                    ? { stepId: payload.stepId || null, message: payload.message || '' }
                    : { stepId: null, message: payload || '' };
                const currentServerOutput = sessionStorage.getItem('serverOutput') || '';
                sessionStorage.setItem('serverOutput', currentServerOutput + normalized.message);
                
                const targetIndex = normalized.stepId
                    ? this.steps.findIndex(s => s.id === normalized.stepId)
                    : this.steps.findIndex(s => s.status === 'active');
                if (targetIndex !== -1 && normalized.message) {
                    this.steps[targetIndex].log += normalized.message;
                }
            });

            this.startCreationProcess();
            
            // Setup modal event listeners
            this.setupModalListeners();
        },
        
        setupModalListeners() {
            const modal = document.getElementById('cancel-modal');
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            const confirmReturnBtn = document.getElementById('confirm-return-btn');
            const cancelModalBtn = document.getElementById('cancel-modal-btn');
            
            if (confirmDeleteBtn) {
                confirmDeleteBtn.addEventListener('click', () => {
                    this.confirmCancelAndDelete();
                });
            }
            
            if (confirmReturnBtn) {
                confirmReturnBtn.addEventListener('click', () => {
                    this.confirmCancelAndReturn();
                });
            }
            
            if (cancelModalBtn) {
                cancelModalBtn.addEventListener('click', () => {
                    this.closeCancelModal();
                });
            }
            
            // Close modal when clicking outside
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        this.closeCancelModal();
                    }
                });
            }
        },
        async startCreationProcess() {
            try {
                const projectDetails = await window.electronAPI.getProjectDetails(this.projectId);
                this.projectPath = projectDetails.projectPath;
                this.githubUrl = projectDetails.repoUrl; // Fixed: database column is repoUrl
                this.repoFolderName = projectDetails.repoFolderName; // This might be null initially

                // If process was not finished, restart it
                if (!this.processFinished) {
                    if (this.isReopenMode && this.repoFolderName) {
                        // For reopen mode, only run build and dev server
                        await window.electronAPI.reopenProject(this.projectId, this.projectPath, this.githubUrl, this.repoFolderName);
                    } else {
                        // For new projects, run full creation process
                        const forkOrg = sessionStorage.getItem('forkOrganization') || '';
                        sessionStorage.removeItem('forkOrganization');
                        await window.electronAPI.startProjectCreation(this.projectId, this.projectPath, this.githubUrl, this.isExistingGitRepo || false, this.isEmptyFolder || false, this.shouldForkFirst || false, this.projectName || '', this.enablePages || false, forkOrg || null);
                    }
                }
            } catch (error) {
                console.error('Error fetching project details or starting creation:', error);
                this.processFailed = true;
                this.processFinished = true;
                const activeStepIndex = this.steps.findIndex(s => s.status === 'active');
                if (activeStepIndex !== -1) {
                    this.steps[activeStepIndex].log += '\nError: ' + (error.message || error);
                    this.steps[activeStepIndex].status = 'failure';
                }
            }
        },
        async cancelProcess() {
            // Pause the process and show confirmation modal
            console.log('cancelProcess called');
            this.processPaused = true;
            
            // Show modal using vanilla JavaScript
            const modal = document.getElementById('cancel-modal');
            if (modal) {
                modal.style.display = 'flex';
                console.log('Modal shown');
            }
        },
        
        async confirmCancelAndDelete() {
            try {
                // Cancel the process and delete project
                if (this.projectId && this.projectPath) {
                    await window.electronAPI.cancelProjectCreation(this.projectId, this.projectPath, this.repoFolderName, true);
                    // Also remove from database
                    await window.electronAPI.removeProject(this.projectId);
                }

                
                // Clear session storage
                sessionStorage.removeItem(`projectCreationState-${this.projectId}`);
                sessionStorage.removeItem('currentProjectId');
                sessionStorage.removeItem('reopenMode');
                
                // Navigate to index
                window.electronAPI.navigateTo('index.html');
            } catch (error) {
                console.error('Error canceling and deleting project:', error);
                alert(__t('create.error_cancel_delete', {error: error}));
            }
        },
        
        async confirmCancelAndReturn() {
            try {
                // Just cancel the process without deleting
                if (this.projectId && this.projectPath) {
                    await window.electronAPI.cancelProjectCreation(this.projectId, this.projectPath, this.repoFolderName, false);
                }

                
                // Clear session storage
                sessionStorage.removeItem(`projectCreationState-${this.projectId}`);
                sessionStorage.removeItem('currentProjectId');
                sessionStorage.removeItem('reopenMode');
                
                // Navigate to index
                window.electronAPI.navigateTo('index.html');
            } catch (error) {
                console.error('Error canceling project:', error);
                alert(__t('create.error_cancel', {error: error}));
            }
        },
        
        closeCancelModal() {
            const modal = document.getElementById('cancel-modal');
            if (modal) {
                modal.style.display = 'none';
            }
            this.processPaused = false;
            // Continue the process
        },
        async retryProcess() {
            this.processFinished = false;
            this.processFailed = false;
            
            if (this.isReopenMode) {
                this.activeStepId = 4;
                this.steps.forEach((step) => {
                    if (step.id === 4) {
                        step.status = 'active';
                        step.log = '';
                    } else if (step.id < 4 || step.id === 6) {
                        step.status = 'success';
                        step.log = __t('create.step_completed_previously');
                    } else {
                        step.status = 'pending';
                        step.log = '';
                    }
                });
            } else {
                if (this.shouldForkFirst) {
                    this.activeStepId = 0;
                    this.steps.forEach((step) => {
                        step.status = step.id === 0 ? 'active' : 'pending';
                        step.log = '';
                    });
                } else if (this.enablePages) {
                    this.activeStepId = 6;
                    this.steps.forEach((step) => {
                        step.status = (step.id === 0) ? 'success' : (step.id === 6 ? 'active' : 'pending');
                        step.log = '';
                    });
                } else {
                    this.activeStepId = 1;
                    this.steps.forEach((step) => {
                        step.status = (step.id === 0 || step.id === 6) ? 'success' : (step.id === 1 ? 'active' : 'pending');
                        step.log = '';
                    });
                }
            }
            
            sessionStorage.removeItem(`projectCreationState-${this.projectId}`);
            await this.startCreationProcess();
    }
}">
<!-- Header -->
<header class="shrink-0 px-8 flex flex-col repo-header" style="padding-bottom: 0;">
  <div class="max-w-4xl mx-auto mt-auto w-full">
    <div class="flex items-center justify-center gap-3 mb-2">
      <span id="page-logo"></span>
      <script>
        (function() {
          var logoHost = document.getElementById('page-logo');
          if (logoHost && window.Documental && window.Documental.renderLogo) {
            logoHost.innerHTML = window.Documental.renderLogo({ size: 'md' });
          }
        })();
      </script>
      <h1 class="text-5xl font-black text-text-dark" x-text="isReopenMode ? __t('create.reopening_workspace') : __t('create.creating_workspace')"></h1>
    </div>
    <p class="text-lg text-muted-dark text-center whitespace-pre-line" x-text="isReopenMode ? __t('create.reopening_subtitle') : __t('create.creating_subtitle')"></p>
  </div>
</header>

<main class="flex-1 overflow-hidden flex flex-col">
  <div class="flex-1 flex items-start justify-center px-8 pb-8 overflow-y-auto">
    <div class="w-full max-w-2xl" style="margin-top: 5vh;">

<div class="text-center mb-8">
<div class="flex items-center justify-center gap-4 mb-3">
<template x-if="!allStepsSuccess">
<div class="creative-loader"></div>
</template>
</div>
</div>
<div class="bg-surface-dark rounded-lg p-4 space-y-2">
<template :key="step.id" x-for="(step, index) in steps">
<div x-show="(step.id !== 0 || shouldForkFirst) && (step.id !== 6 || enablePages)" :class="{ 'opacity-60': step.status !== 'active' && step.status !== 'failure' && step.status !== 'success'}" class="bg-background-dark/50 rounded-lg text-sm">
<div :class="{'cursor-pointer': step.status !== 'active'}" @click="step.expanded = !step.expanded" class="flex items-center justify-between p-3">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-6 h-6">
<template x-if="step.status === 'active'">
<span class="material-symbols-outlined text-primary text-xl step-icon-active">autorenew</span>
</template>
<template x-if="step.status === 'success'">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full" style="background-color: color-mix(in srgb, var(--color-primary) 20%, transparent); color: var(--color-primary);"><span class="material-symbols-outlined text-xl">check_circle</span></span>
</template>
<template x-if="step.status === 'failure'">
<span class="material-symbols-outlined text-danger text-xl">error</span>
</template>
<template x-if="step.status === 'pending'">
<div class="w-4 h-4 border-2 border-border-subtle rounded-full"></div>
</template>
</div>
<span :class="{ 'text-muted-dark': step.status === 'pending', 'text-text-dark font-semibold': step.status === 'success', 'text-text-dark': step.status === 'active', 'text-danger': step.status === 'failure' }" class="font-medium" x-text="step.title"></span>
</div>
<span :class="{ 'rotate-180': step.expanded }" class="material-symbols-outlined transition-transform">expand_more</span>
</div>
<div x-cloak="" x-show="step.expanded" x-transition:enter="transition ease-out duration-300" x-transition:enter-end="opacity-100 translate-y-0" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:leave="transition ease-in duration-200" x-transition:leave-end="opacity-0 -translate-y-2" x-transition:leave-start="opacity-100 translate-y-0">
<div class="px-3 pb-3">
<div class="bg-background-dark rounded-md p-3 max-h-40 overflow-y-auto border border-border-subtle">
<pre class="text-xs text-muted-dark whitespace-pre-wrap font-mono" x-text="step.log"></pre>
</div>
</div>
</div>
</div>
</template>
</div>
<p class="text-xs text-muted-dark text-center mt-3" x-text="steps.filter(s => s.status === 'success').length + ' / ' + steps.filter(s => (s.id !== 0 || shouldForkFirst) && (s.id !== 6 || enablePages)).length"></p>
</div>
</div>
</main>
<footer class="shrink-0">
<div class="p-4 border-t border-border-subtle bg-surface-dark">
    <div class="flex items-center justify-between gap-4 max-w-2xl mx-auto">
        <button @click="cancelProcess()" class="bg-danger hover:bg-danger-dark text-white font-semibold py-2 px-5 rounded-md transition-colors duration-300 text-sm">
            <span class="material-symbols-outlined align-middle mr-1">close</span>
            <span x-text="__t('common.cancel')">Cancel</span>
        </button>
        <div class="flex justify-end gap-3">
 <template x-if="!anyStepFailed">
 <button :class="{'!bg-primary !hover:bg-primary-hover': allStepsSuccess}" :disabled="!allStepsSuccess" @click="allStepsSuccess ? (sessionStorage.setItem('currentProjectId', projectId), window.electronAPI.navigateTo('main.html')) : $event.target.innerText = __t('create.finished');" class="bg-surface-secondary text-white font-semibold py-2 px-5 rounded-md flex items-center gap-2 transition-colors duration-300 disabled:bg-surface-secondary disabled:cursor-not-allowed text-sm">
 <span x-text="allStepsSuccess ? __t('common.finish') : __t('common.advance')"></span>
 </button>
 </template>
 <template x-if="anyStepFailed">
 <button :disabled="!processFinished" @click="retryProcess()" class="bg-info hover:bg-info-dark text-white font-semibold py-2 px-5 rounded-md flex items-center gap-2 transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed text-sm">
                    <span x-text="__t('common.try_again')">Try Again</span>
                </button>
 </template>
        </div>
    </div>
</div>
</footer>
</div>

<!-- Modal de confirmação para cancelar -->
<div id="cancel-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" style="display: none;">
    <div class="bg-surface-dark rounded-lg shadow-xl p-6 w-full max-w-md mx-4">
        <div class="flex items-center gap-3 mb-4">
            <span class="material-symbols-outlined text-warning text-2xl">warning</span>
            <h3 class="text-lg font-medium text-text-dark" data-i18n="create.cancel_creation_title"></h3>
        </div>
        <p class="text-sm text-muted-dark mb-6 whitespace-pre-line" data-i18n="create.cancel_creation_desc"></p>
        
        <div class="space-y-3">
            <button id="confirm-delete-btn" 
                    class="w-full px-4 py-2 text-sm font-medium text-white bg-danger rounded-md hover:bg-danger-dark transition-colors duration-200">
                <span data-i18n="create.yes_delete"></span>
            </button>
            <button id="confirm-return-btn" 
                    class="w-full px-4 py-2 text-sm font-medium text-on-warning bg-warning rounded-md hover:bg-warning-dark transition-colors duration-200">
                <span data-i18n="create.yes_return"></span>
            </button>
            <button id="cancel-modal-btn" 
                    class="w-full px-4 py-2 text-sm font-medium text-muted-dark bg-surface-secondary rounded-md hover:bg-surface-dark transition-colors duration-200">
                <span data-i18n="create.no_continue"></span>
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function() {
  if (window.applyTranslations) {
    await window.applyTranslations();
  } else if (window.__i18nReady) {
    await window.__i18nReady;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      el.textContent = window.__t(el.getAttribute('data-i18n'));
    });
  }
});
</script>

<script src="./shared/theme-init.js" defer></script>
<script>
// --- Theme picker ---
function applyThemeMode(mode) {
    var shouldBeDark;
    if (mode === 'auto') {
        shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    } else {
        shouldBeDark = mode === 'dark';
    }
    document.documentElement.classList.toggle('dark', shouldBeDark);
    document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.theme === mode);
    });
    if (window.electronAPI && window.electronAPI.setThemeMode) {
        window.electronAPI.setThemeMode(mode).then(function (result) {
            if (result && result.css) {
                var el = document.getElementById('__theme_injected');
                if (!el) {
                    el = document.createElement('style');
                    el.id = '__theme_injected';
                    document.head.appendChild(el);
                }
                el.textContent = result.css;
            }
        }).catch(function (e) { console.warn('setThemeMode error:', e); });
    }
}
function initThemePicker() {
    document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            applyThemeMode(btn.dataset.theme);
        });
    });
    if (window.electronAPI && window.electronAPI.getThemeMode) {
        window.electronAPI.getThemeMode().then(function (r) {
            if (r && r.success) {
                var mode = r.mode || 'auto';
                document.querySelectorAll('.theme-btn').forEach(function (btn) {
                    btn.classList.toggle('active', btn.dataset.theme === mode);
                });
            }
        }).catch(function () {});
    } else {
        var isDark = document.documentElement.classList.contains('dark');
        var inferred = isDark ? 'dark' : 'light';
        document.querySelectorAll('.theme-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.theme === inferred);
        });
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initThemePicker);
} else {
    initThemePicker();
}
</script>
</body></html>
