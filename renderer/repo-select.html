<!DOCTYPE html>
<html class="dark" lang="pt-BR" data-i18n-document-title="repo_select.page_title"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="repo_select.page_title">Documental - Select Repository</title>
<link href="./assets/css/fonts.css" rel="stylesheet"/>
<link href="./assets/css/compiled.css" rel="stylesheet"/>
<link href="./assets/css/theme-override.css" rel="stylesheet"/>
<style>[x-cloak]{display:none!important}</style>
<style>
.repo-header { padding-top: 12vh !important; }
@media (min-height: 800px) { .repo-header { padding-top: 15vh !important; } }
@media (min-height: 1000px) { .repo-header { padding-top: 18vh !important; } }
@media (min-height: 1200px) { .repo-header { padding-top: 22vh !important; } }
.repo-content { padding-top: 1rem; }
@media (min-height: 800px) { .repo-content { padding-top: 1.25rem; } }
@media (min-height: 1000px) { .repo-content { padding-top: 1.5rem; } }
@media (min-height: 1200px) { .repo-content { padding-top: 2rem; } }
</style>

<!-- Shared components -->
<script src="./shared/layout.js"></script>
<script src="./shared/footer.js"></script>
<script src="./shared/logo.js"></script>
<script src="./shared/i18n-apply.js"></script>
<script src="./shared/theme-init.js" defer></script>

<script src="./i18n.js"></script>
<script src="script.js" defer></script>
<script>
// Register Alpine component before alpine.min.js loads
document.addEventListener('alpine:init', () => {
  Alpine.data('repoSelect', () => ({
    repos: [],
    loading: true,
    scanning: false,
    error: null,
    selectedRepo: null,
    searchQuery: '',
    documentalFilter: true,
    privateFilter: false,
    personalFilter: false,

    async init() {
      this.loading = true;
      this.error = null;
      try {
        // Ensure translations are ready before rendering labels
        if (window.__i18nReady) await window.__i18nReady;
        const result = await window.electronAPI.listUserRepos();
        if (result.success) {
          this.repos = result.repos || [];
        } else {
          this.error = result.error || __t('repo_select.error_generic') || 'Failed to load repositories';
        }
      } catch (err) {
        this.error = (err && err.message) ? err.message : 'Failed to load repositories';
      } finally {
        this.loading = false;
      }
    },

    /**
     * Repos filtered by current search query (case-insensitive name match).
     */
    get filteredRepos() {
      const q = (this.searchQuery || '').toLowerCase();
      let list = this.repos;
      if (this.documentalFilter) {
        list = list.filter(repo => repo.isDocumental === true);
      }
      if (this.privateFilter) {
        list = list.filter(repo => repo.private === true);
      }
      if (this.personalFilter) {
        list = list.filter(repo => repo.owner && repo.owner.type === 'User');
      }
      if (q) {
        list = list.filter(repo => (repo.name || '').toLowerCase().includes(q));
      }
      return list;
    },

    /**
     * Filtered repos grouped by owner login. Returns an array of
     * { owner: string, repos: Array } preserving first-seen order.
     */
    get groupedRepos() {
      const groups = [];
      const indexByKey = {};
      for (const repo of this.filteredRepos) {
        const owner = (repo.owner && repo.owner.login)
          ? repo.owner.login
          : ((repo.full_name || repo.name || '').split('/')[0] || '—');
        if (indexByKey[owner] === undefined) {
          indexByKey[owner] = groups.length;
          groups.push({ owner, repos: [] });
        }
        groups[indexByKey[owner]].repos.push(repo);
      }
      return groups;
    },

    /**
     * True when there are multiple distinct owners (group headers shown).
     */
    get hasMultipleOwners() {
      const seen = new Set();
      for (const repo of this.filteredRepos) {
        const owner = (repo.owner && repo.owner.login)
          ? repo.owner.login
          : ((repo.full_name || repo.name || '').split('/')[0] || '—');
        seen.add(owner);
        if (seen.size > 1) return true;
      }
      return false;
    },

    selectRepo(repo) {
      this.selectedRepo = repo;
    },

    continueWithSelected() {
      if (!this.selectedRepo) return;
      sessionStorage.setItem('repoSelectMode', 'existing');
      sessionStorage.setItem('selectedRepo', JSON.stringify(this.selectedRepo));
      window.electronAPI.navigateTo('new.html');
    },

    createFork() {
      sessionStorage.setItem('repoSelectMode', 'fork');
      window.electronAPI.navigateTo('new.html');
    },

    /**
     * Detects which repos are Documental repos via backend scan.
     * Sets repo.isDocumental on each entry. Defensive: always clears
     * the scanning flag via timeout + finally.
     */
    async scanDocumentalRepos() {
      this.scanning = true;
      // 15s safety timeout that clears scanning regardless of result
      const timeoutId = setTimeout(() => {
        this.scanning = false;
      }, 15000);
      try {
        const result = await window.electronAPI.findDocumentalRepos();
        if (result && result.success && Array.isArray(result.documentalRepos)) {
          for (const repo of this.repos) {
            repo.isDocumental = result.documentalRepos.includes(repo.full_name);
          }
        } else {
          for (const repo of this.repos) {
            repo.isDocumental = false;
          }
        }
      } catch (err) {
        console.warn('Documental detection failed:', err);
        for (const repo of this.repos) {
          repo.isDocumental = false;
        }
      } finally {
        clearTimeout(timeoutId);
        this.scanning = false;
      }
    }
  }));
});

// Apply translations to declarative [data-i18n] elements once i18n is ready.
// Uses shared/i18n-apply.js (no inline DOM writes).
document.addEventListener('DOMContentLoaded', async function() {
  if (window.applyTranslations) {
    await window.applyTranslations();
  } else if (window.__i18nReady) {
    await window.__i18nReady;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      el.textContent = window.__t(el.getAttribute('data-i18n'));
    });
  }
  document.title = window.__t('repo_select.page_title');
});

// Inject logo SVG during parse (before paint) to avoid flicker.
document.addEventListener('DOMContentLoaded', function() {
  var slot = document.getElementById('page-logo');
  if (slot && window.renderLogo) {
    slot.innerHTML = renderLogo({ size: 'md' });
  }
});
</script>
<script src="./assets/js/alpine.min.js" defer></script>
</head>
<body class="bg-background-dark text-text-dark antialiased">
<div class="flex flex-col h-screen">

  <!-- Header (shrink-0) -->
  <header class="shrink-0 px-8 flex flex-col repo-header" style="padding-bottom: 0;">
    <div class="max-w-4xl mx-auto mt-auto">
      <button data-navigate="index.html" class="btn-back">
        <span class="material-symbols-outlined">arrow_back</span>
        <span data-i18n="common.back">Back</span>
      </button>
      <div class="flex items-center justify-center gap-3 mb-2">
        <span id="page-logo"></span>
        <h1 class="text-5xl font-black text-text-dark" data-i18n="repo_select.title">Choose a Repository</h1>
      </div>
      <p class="text-lg text-muted-dark text-center whitespace-pre-line" data-i18n="repo_select.subtitle">You need a GitHub repository to save and publish your documentation.</p>
    </div>
  </header>

  <!-- Main content (Alpine scope covers list + footer) -->
  <main x-data="repoSelect" x-init="init()" class="flex-1 overflow-hidden flex flex-col">

    <!-- Scrollable repo list area (fixed-height box with internal scroll) -->
    <div class="flex-1 overflow-y-auto px-8 pb-6">
      <div class="page-center max-w-4xl mx-auto w-full repo-content">

        <!-- Scanning state (documental detection) -->
        <div x-show="scanning" x-cloak class="flex flex-col items-center justify-center space-y-4 py-20 min-h-[16rem]">
          <div class="w-16 h-16 border-4 border-border-default border-t-primary rounded-full animate-spin"></div>
          <p class="text-xs uppercase tracking-[0.3em] text-muted-dark" x-text="__t('repo_select.scanning_documental')">Buscando repositórios Documental</p>
        </div>

        <!-- Loading state (fixed-height container prevents layout shift) -->
        <div x-show="loading" x-cloak class="flex justify-center items-center py-20 min-h-[16rem]">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
          <span class="ml-4 text-muted-dark" x-text="__t('repo_select.loading_repos')">Loading repositories...</span>
        </div>

        <!-- Error state -->
        <div x-show="error &amp;&amp; !loading &amp;&amp; !scanning" x-cloak class="text-center py-20 min-h-[16rem] flex flex-col items-center justify-center">
          <p class="text-danger mb-4" x-text="error"></p>
          <button @click="init()" class="inline-flex items-center gap-2 bg-surface-secondary hover:bg-surface-dark text-text-dark font-semibold py-2 px-5 rounded-md transition-colors duration-300 text-sm">
            <span class="material-symbols-outlined">refresh</span>
            <span data-i18n="common.try_again">Try Again</span>
          </button>
        </div>

        <!-- Repo list (with filter + toggle + scrollable grid) -->
        <div x-show="!loading &amp;&amp; !scanning &amp;&amp; !error" x-cloak class="w-full pt-2">

          <!-- Search/filter -->
          <div class="mb-4 flex items-center gap-3">
            <div class="relative flex-1">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted-dark pointer-events-none">search</span>
              <input type="search"
                     x-model="searchQuery"
                     data-i18n-placeholder="repo_select.search_placeholder"
                     :placeholder="window.__t ? window.__t('repo_select.search_placeholder') : 'Search repositories...'"
                     class="input w-full pl-10 pr-4 py-2 bg-surface-dark border border-border-subtle rounded-md text-text-dark placeholder-muted-dark focus:outline-none focus:ring-2 focus:ring-primary" />
            </div>
            <span class="text-sm text-muted-dark whitespace-nowrap" x-text="window.__t('repo_select.repo_count', { count: filteredRepos.length })"></span>
          </div>

          <!-- Filter toggles -->
          <div class="mb-6 flex items-center justify-center gap-6">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <div @click="documentalFilter = !documentalFilter"
                   class="w-10 h-6 rounded-full transition-colors duration-200 relative flex items-center"
                   :class="documentalFilter ? 'bg-primary' : 'bg-surface-dark'">
                <div class="w-4 h-4 rounded-full bg-white transition-all duration-200"
                     :style="documentalFilter ? 'margin-left: 1.25rem;' : 'margin-left: 0.25rem;'"></div>
              </div>
              <span class="text-sm text-muted-dark" x-text="__t('repo_select.filter_documental')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <div @click="privateFilter = !privateFilter"
                   class="w-10 h-6 rounded-full transition-colors duration-200 relative flex items-center"
                   :class="privateFilter ? 'bg-primary' : 'bg-surface-dark'">
                <div class="w-4 h-4 rounded-full bg-white transition-all duration-200"
                     :style="privateFilter ? 'margin-left: 1.25rem;' : 'margin-left: 0.25rem;'"></div>
              </div>
              <span class="text-sm text-muted-dark" x-text="__t('repo_select.filter_private')"></span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <div @click="personalFilter = !personalFilter"
                   class="w-10 h-6 rounded-full transition-colors duration-200 relative flex items-center"
                   :class="personalFilter ? 'bg-primary' : 'bg-surface-dark'">
                <div class="w-4 h-4 rounded-full bg-white transition-all duration-200"
                     :style="personalFilter ? 'margin-left: 1.25rem;' : 'margin-left: 0.25rem;'"></div>
              </div>
              <span class="text-sm text-muted-dark" x-text="__t('repo_select.filter_personal')"></span>
            </label>
          </div>

          <!-- Empty state: no repos match current filters -->
          <div x-show="repos.length === 0 || filteredRepos.length === 0" x-cloak class="text-center py-10 text-muted-dark min-h-[16rem] flex flex-col items-center justify-center">
            <span class="material-symbols-outlined text-5xl text-muted-dark mb-3 block">inbox</span>
            <p class="whitespace-pre-line mb-6 max-w-md" x-text="__t('repo_select.no_repos')"></p>
            <button @click="createFork()" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-5 rounded-md transition-colors duration-300 text-sm">
              <span class="material-symbols-outlined">alt_route</span>
              <span data-i18n="repo_select.button_create_fork">Create New Fork</span>
            </button>
          </div>

          <!-- Empty state: no documental repos found -->
          <div x-show="documentalFilter &amp;&amp; filteredRepos.length === 0 &amp;&amp; repos.length > 0" x-cloak class="flex flex-col items-center justify-center py-12 text-center">
            <p class="text-muted-dark whitespace-pre-line" x-text="__t('repo_select.no_documental_repos')"></p>
          </div>

          <!-- Fixed-height scrollable repo grid -->
          <div x-show="filteredRepos.length > 0" x-cloak class="border border-border-subtle rounded-lg bg-surface-dark text-left" style="max-height: 540px; overflow-y: auto;">

            <!-- Single-owner layout: flat grid (no group headers) -->
            <template x-if="!hasMultipleOwners">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 p-3">
                <template x-for="repo in filteredRepos" :key="repo.id">
                  <div @click="selectRepo(repo)"
                       class="rounded-lg p-3 cursor-pointer transition-colors duration-200 hover:bg-surface-card border border-border-subtle"
                       :class="selectedRepo &amp;&amp; selectedRepo.id === repo.id ? 'ring-2 ring-primary' : ''">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex flex-col min-w-0 flex-1">
                        <span class="font-medium text-text-dark truncate" x-text="repo.name"></span>
                        <span class="text-sm text-muted-dark truncate" x-text="repo.description || repo.full_name"></span>
                      </div>
                      <div class="flex items-center gap-1.5 flex-shrink-0">
                        <template x-if="repo.isDocumental">
                           <span class="badge-primary" x-text="__t('repo_select.documental_badge')">Documental</span>
                         </template>
                        <template x-if="repo.private">
                          <span class="bg-surface-dark text-muted-dark text-xs font-medium rounded-full px-2 py-0.5" x-text="__t('repo_select.private_repo_label')">Private</span>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Multi-owner layout: grouped grid with owner headers -->
            <template x-if="hasMultipleOwners">
              <div class="space-y-4 p-3">
                <template x-for="group in groupedRepos" :key="group.owner">
                  <div>
                    <h3 class="text-sm font-semibold text-muted-dark mt-4 mb-2 first:mt-0" x-text="group.owner"></h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <template x-for="repo in group.repos" :key="repo.id">
                        <div @click="selectRepo(repo)"
                             class="rounded-lg p-3 cursor-pointer transition-colors duration-200 hover:bg-surface-card border border-border-subtle"
                             :class="selectedRepo &amp;&amp; selectedRepo.id === repo.id ? 'ring-2 ring-primary' : ''">
                          <div class="flex items-center justify-between gap-2">
                            <div class="flex flex-col min-w-0 flex-1">
                              <span class="font-medium text-text-dark truncate" x-text="repo.name"></span>
                              <span class="text-sm text-muted-dark truncate" x-text="repo.description || repo.full_name"></span>
                            </div>
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                              <template x-if="repo.isDocumental">
                                <span class="badge-primary" x-text="__t('repo_select.documental_badge')">Documental</span>
                              </template>
                              <template x-if="repo.private">
                                <span class="bg-surface-dark text-muted-dark text-xs font-medium rounded-full px-2 py-0.5" x-text="__t('repo_select.private_repo_label')">Private</span>
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>

          </div>

        </div>

      </div>
    </div>

    <!-- Footer with action buttons (inline because Alpine directives :disabled/@click) -->
    <footer x-show="!loading &amp;&amp; !scanning &amp;&amp; !error" x-cloak class="shrink-0 p-4 border-t border-border-subtle bg-surface-dark mt-auto">
      <div class="flex justify-between items-center max-w-4xl mx-auto gap-3">
        <button @click="createFork()" class="inline-flex items-center gap-2 bg-surface-secondary hover:bg-background-dark text-text-dark font-semibold py-2 px-5 rounded-md transition-colors duration-300 text-sm">
          <span class="material-symbols-outlined">alt_route</span>
          <span data-i18n="repo_select.button_create_fork">Create New Fork</span>
        </button>
        <button @click="continueWithSelected()" :disabled="!selectedRepo"
                class="inline-flex items-center gap-2 bg-primary hover:bg-primary-hover text-white font-semibold py-2 px-5 rounded-md transition-colors duration-300 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
          <span class="material-symbols-outlined">arrow_forward</span>
          <span data-i18n="repo_select.button_continue">Continue</span>
        </button>
      </div>
    </footer>

  </main>
</div>

</body></html>
