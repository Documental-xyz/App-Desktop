<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon-favicon.png"/>
    <title>Documental - Choose Language</title>
    <link href="./assets/css/fonts.css" rel="stylesheet"/>
    <link href="./assets/css/compiled.css" rel="stylesheet"/>
    <link href="./assets/css/theme-override.css" rel="stylesheet"/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Subtle animated gradient background */
        .bg-scene {
            background:
                radial-gradient(ellipse 80% 60% at 50% 45%, rgba(from var(--color-primary) r g b / 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 20% 80%, rgba(from var(--color-primary) r g b / 0.03) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 20%, rgba(from var(--color-primary) r g b / 0.03) 0%, transparent 60%),
                var(--color-background-dark);
        }

        /* Entrance animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(from var(--color-primary) r g b / 0); }
            50%      { box-shadow: 0 0 20px 2px rgba(from var(--color-primary) r g b / 0.12); }
        }

        .anim-logo {
            animation: fadeIn 0.6s ease-out both;
        }

        .anim-heading {
            animation: fadeInUp 0.5s ease-out 0.15s both;
        }

        .anim-subtitle {
            animation: fadeInUp 0.5s ease-out 0.3s both;
        }

        .anim-card-1 {
            animation: fadeInUp 0.5s ease-out 0.45s both;
        }

        .anim-card-2 {
            animation: fadeInUp 0.5s ease-out 0.55s both;
        }

        .anim-card-3 {
            animation: fadeInUp 0.5s ease-out 0.65s both;
        }

        .anim-footer {
            animation: fadeIn 0.5s ease-out 0.8s both;
        }

        /* Language card */
        .lang-card {
            position: relative;
            width: 210px;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            background: var(--color-surface-card-alt);
            border: 1.5px solid var(--color-border-subtle);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            text-align: center;
        }

        .lang-card:hover {
            transform: translateY(-6px) scale(1.04);
            border-color: var(--color-primary);
            box-shadow:
                0 0 0 1px rgba(from var(--color-primary) r g b / 0.25),
                0 8px 32px -4px rgba(from var(--color-primary) r g b / 0.18),
                0 4px 16px -2px rgba(0, 0, 0, 0.4);
        }

        .lang-card:active {
            transform: translateY(-2px) scale(1.01);
            transition-duration: 0.08s;
        }

        .lang-card:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 3px;
        }

        /* Flag container */
        .flag-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            font-size: 44px;
            line-height: 1;
            transition: transform 0.25s ease;
        }

        .lang-card:hover .flag-icon {
            transform: scale(1.1);
        }

        /* Flag background circles — subtle tinted */
        .flag-bg-en {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        }

        .flag-bg-pt {
            background: radial-gradient(circle, rgba(34, 197, 94, 0.12) 0%, transparent 70%);
        }

        .flag-bg-es {
            background: radial-gradient(circle, rgba(234, 179, 8, 0.12) 0%, transparent 70%);
        }

        /* Language code text (replaces SVG flags) */
        .lang-code {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--color-text-dark);
            line-height: 1;
        }

        /* Decorative dot grid */
        .dot-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.35;
        }

        .dot-grid::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -30%;
            width: 400px;
            height: 400px;
            background-image: radial-gradient(circle, var(--color-border-subtle) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .dot-grid::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -20%;
            width: 300px;
            height: 300px;
            background-image: radial-gradient(circle, var(--color-border-subtle) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Logo icon (legacy SVG) */
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary) 100%);
            box-shadow: 0 4px 16px rgba(from var(--color-primary) r g b / 0.25);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        /* Hero logo (PNG) */
        .app-logo-hero {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            border: 2px solid var(--color-border-subtle);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
            background: var(--color-surface-card);
        }

        .dark .app-logo-hero {
            border-color: var(--color-border-subtle);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        /* Theme picker (top-right) */
        .theme-picker {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-picker-group {
            display: inline-flex;
            align-items: center;
            gap: 0;
            padding: 0.25rem;
            border-radius: 0.5rem;
            background: var(--color-surface-dark);
            border: 1px solid var(--color-border-subtle);
        }

        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--color-muted-dark, var(--color-text-dark));
        }

        .theme-btn:hover {
            color: var(--color-text-dark);
        }

        .theme-btn.active {
            background: var(--color-surface-card);
            color: var(--color-primary);
        }

        .theme-btn .material-symbols-outlined {
            font-size: 1rem;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-background-dark text-text-dark antialiased">
    <!-- Theme picker (top-right) -->
    <div class="theme-picker">
        <div class="theme-picker-group">
            <button class="theme-btn" data-theme="auto" aria-label="Auto theme">
                <span class="material-symbols-outlined">contrast</span>
            </button>
            <button class="theme-btn" data-theme="dark" aria-label="Dark theme">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
            <button class="theme-btn" data-theme="light" aria-label="Light theme">
                <span class="material-symbols-outlined">light_mode</span>
            </button>
        </div>
    </div>

    <div class="bg-scene min-h-screen flex flex-col items-center justify-center relative">
        <!-- Decorative dot grid -->
        <div class="dot-grid"></div>

        <!-- Content -->
        <div class="relative z-10 flex flex-col items-center px-6">
            <!-- Logo -->
            <div class="anim-logo mb-8">
                <img class="app-logo-hero" src="./assets/img/logo-documental.png" alt="Documental" />
            </div>

            <!-- App title -->
            <h1 class="anim-heading text-3xl font-black tracking-tight text-text-dark mb-2">
                Documental
            </h1>

            <!-- Heading -->
            <p class="anim-heading text-lg text-text-dark font-semibold mb-1">
                Choose your language
            </p>
            <p class="anim-subtitle text-sm text-muted-dark mb-10">
                Escolha seu idioma &nbsp;&middot;&nbsp; Elige tu idioma
            </p>

            <!-- Language Cards -->
            <div class="flex flex-row items-center gap-6">

                <!-- English -->
                <div class="lang-card anim-card-1"
                     tabindex="0"
                     role="button"
                     aria-label="Select English"
                     onclick="selectLanguage('en')"
                     onkeydown="if(event.key==='Enter')selectLanguage('en')">
                    <div class="flag-icon flag-bg-en">
                        <span class="lang-code">EN</span>
                    </div>
                    <div class="text-lg font-bold text-text-dark mb-1">English</div>
                    <div class="text-sm text-muted-dark">Welcome</div>
                </div>

                <!-- Português -->
                <div class="lang-card anim-card-2"
                     tabindex="0"
                     role="button"
                     aria-label="Selecionar Português"
                     onclick="selectLanguage('pt-BR')"
                     onkeydown="if(event.key==='Enter')selectLanguage('pt-BR')">
                    <div class="flag-icon flag-bg-pt">
                        <span class="lang-code">PT</span>
                    </div>
                    <div class="text-lg font-bold text-text-dark mb-1">Portugu&ecirc;s</div>
                    <div class="text-sm text-muted-dark">Bem-vindo</div>
                </div>

                <!-- Español -->
                <div class="lang-card anim-card-3"
                     tabindex="0"
                     role="button"
                     aria-label="Seleccionar Español"
                     onclick="selectLanguage('es')"
                     onkeydown="if(event.key==='Enter')selectLanguage('es')">
                    <div class="flag-icon flag-bg-es">
                        <span class="lang-code">ES</span>
                    </div>
                    <div class="text-lg font-bold text-text-dark mb-1">Espa&ntilde;ol</div>
                    <div class="text-sm text-muted-dark">Bienvenido</div>
                </div>

            </div>
        </div>

        <!-- Footer -->
       
    </div>

    <script>
        function selectLanguage(locale) {
            console.log('Language selected:', locale);
            
            // Save to localStorage FIRST (synchronous, guaranteed)
            try {
                localStorage.setItem('appLocale', locale);
            } catch (e) {
                console.warn('localStorage error:', e);
            }

            // Also save via IPC for persistence across app restarts
            if (window.electronAPI && window.electronAPI.setAppLocale) {
                window.electronAPI.setAppLocale(locale);
            }

            // Navigate immediately — no need to wait for IPC
            navigateToWelcome();
        }

        function navigateToWelcome() {
            if (window.electronAPI && window.electronAPI.navigateTo) {
                try {
                    window.electronAPI.navigateTo('welcome.html');
                } catch (e) {
                    console.warn('navigateTo error:', e);
                    window.location.href = 'welcome.html';
                }
            } else {
                window.location.href = 'welcome.html';
            }
        }

        // --- Theme picker ---
        function applyThemeMode(mode) {
            // Apply visually
            var shouldBeDark;
            if (mode === 'auto') {
                shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } else {
                shouldBeDark = mode === 'dark';
            }
            document.documentElement.classList.toggle('dark', shouldBeDark);

            // Update active button state
            document.querySelectorAll('.theme-btn').forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.theme === mode);
            });

            // Persist via IPC
            if (window.electronAPI && window.electronAPI.setThemeMode) {
                window.electronAPI.setThemeMode(mode).then(function (result) {
                    if (result && result.css) {
                        var el = document.getElementById('__theme_injected');
                        if (!el) {
                            el = document.createElement('style');
                            el.id = '__theme_injected';
                            document.head.appendChild(el);
                        }
                        el.textContent = result.css;
                    }
                }).catch(function (e) { console.warn('setThemeMode error:', e); });
            }
        }

        function initThemePicker() {
            // Wire up click handlers
            document.querySelectorAll('.theme-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    applyThemeMode(btn.dataset.theme);
                });
            });

            // Determine initial active state
            if (window.electronAPI && window.electronAPI.getThemeMode) {
                window.electronAPI.getThemeMode().then(function (r) {
                    if (r && r.success) {
                        var mode = r.mode || 'auto';
                        document.querySelectorAll('.theme-btn').forEach(function (btn) {
                            btn.classList.toggle('active', btn.dataset.theme === mode);
                        });
                    }
                }).catch(function () {});
            } else {
                // Fallback: infer from current document class
                var isDark = document.documentElement.classList.contains('dark');
                var inferred = isDark ? 'dark' : 'light';
                document.querySelectorAll('.theme-btn').forEach(function (btn) {
                    btn.classList.toggle('active', btn.dataset.theme === inferred);
                });
            }
        }

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initThemePicker);
        } else {
            initThemePicker();
        }
    </script>
<script src="./shared/theme-init.js" defer></script>
</body>
</html>
