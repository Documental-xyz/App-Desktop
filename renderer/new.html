    top: 1rem;

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = __t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = __t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = __t(el.dataset.i18nTitle);
  });

<script src="script.js" defer></script>
<script>
// Wait for both DOM and script.js to be ready
function waitForElements() {
  return new Promise((resolve) => {
    const checkElements = () => {
      const projectPathInput = document.getElementById('project-path');
      const projectNameInput = document.getElementById('project-name');
      const githubUrlInput = document.getElementById('github-url');
      
      if (projectPathInput && projectNameInput && githubUrlInput) {
        resolve();
      } else {
        setTimeout(checkElements, 50);
      }
    };
    checkElements();
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  // Wait for elements to be available
  await waitForElements();
  
  // Check if creating from folder selection
  const createFromFolder = sessionStorage.getItem('createFromFolder');
  const selectedProjectPath = sessionStorage.getItem('selectedProjectPath');
  
  if (createFromFolder === 'true' && selectedProjectPath) {
    // Set path SYNCHRONOUSLY to prevent script.js from overwriting with default Workspaces path
    const pathInputSync = document.getElementById('project-path');
    if (pathInputSync) {
      pathInputSync.value = selectedProjectPath;
    }
    
    setTimeout(async () => {
      // Pre-fill the project path
      const projectPathInput = document.getElementById('project-path');
      if (projectPathInput) {
        // Normalize the path using the same utility as script.js
        let normalizedPath = selectedProjectPath;
        if (window.electronAPI && window.electronAPI.normalizePath) {
          try {
            normalizedPath = await window.electronAPI.normalizePath(selectedProjectPath);
          } catch (error) {
            console.warn('Failed to normalize path:', error);
          }
        }
        
        projectPathInput.value = normalizedPath;
        
        // Trigger input event to ensure any listeners are notified
        projectPathInput.dispatchEvent(new Event('input', { bubbles: true }));

        // Path is fixed when coming from folder selection — make readonly and hide selector
        projectPathInput.setAttribute('readonly', '');
        projectPathInput.classList.add('opacity-70', 'cursor-not-allowed');

        const selectFolderBtn = document.getElementById('select-folder-button');
        if (selectFolderBtn) {
          selectFolderBtn.style.display = 'none';
        }
      } else {
        console.error('Project path input not found');
      }
      
      // Get folder info and pre-fill other fields if possible
      (async () => {
        if (window.electronAPI && window.electronAPI.getFolderInfo) {
          try {
            const folderInfo = await window.electronAPI.getFolderInfo(selectedProjectPath);
            
            if (folderInfo.isGitRepo && folderInfo.remoteUrl) {
              // Pre-fill GitHub URL
              const githubUrlInput = document.getElementById('github-url');
              if (githubUrlInput) {
                githubUrlInput.value = folderInfo.remoteUrl;
                githubUrlInput.dispatchEvent(new Event('input', { bubbles: true }));
              }
              
              // Pre-fill project name from repo name
              const projectNameInput = document.getElementById('project-name');
              if (projectNameInput && !projectNameInput.value) {
                const repoName = folderInfo.remoteUrl.split('/').pop().replace('.git', '');
                projectNameInput.value = repoName;
                projectNameInput.dispatchEvent(new Event('input', { bubbles: true }));
              }
            }
            
            // Store folder info for later use
            sessionStorage.setItem('folderInfo', JSON.stringify(folderInfo));

            // Make URL readonly when it was auto-filled from git remote
            const githubUrlInput = document.getElementById('github-url');
            if (githubUrlInput && githubUrlInput.value) {
              githubUrlInput.setAttribute('readonly', '');
              githubUrlInput.classList.add('opacity-70', 'cursor-not-allowed');
            }
          } catch (error) {
            console.error('Error getting folder info:', error);
          }
        }
        
        // Clear session storage
        sessionStorage.removeItem('createFromFolder');
        sessionStorage.removeItem('selectedProjectPath');
      })();
    }, 100);
  }

  // Handle repo-select modes (existing repo prefill or fork defaults)
  const repoSelectMode = sessionStorage.getItem('repoSelectMode');
  if (repoSelectMode === 'existing') {
    const selectedRepo = JSON.parse(sessionStorage.getItem('selectedRepo') || '{}');
    const nameInput = document.getElementById('project-name');
    const urlInput = document.getElementById('github-url');
    if (nameInput && selectedRepo.name) {
      nameInput.value = selectedRepo.name;
    }
    if (urlInput && selectedRepo.clone_url) {
      urlInput.value = selectedRepo.clone_url;
      urlInput.setAttribute('readonly', '');
      urlInput.classList.add('opacity-70', 'cursor-not-allowed');
    }
  } else if (repoSelectMode === 'template') {
    const nameInput = document.getElementById('project-name');
    const urlInput = document.getElementById('github-url');
    if (nameInput) nameInput.value = 'Meu Documental';
    if (urlInput) urlInput.value = 'https://github.com/Documental-xyz/Template.git';
    // Hide URL field and label when creating a new repository
    const urlFieldDiv = urlInput ? urlInput.closest('div') : null;
    if (urlFieldDiv) urlFieldDiv.style.display = 'none';
  }

  // Show private toggle only in fork mode
  const repoSelectMode2 = sessionStorage.getItem('repoSelectMode');
  const privateWrapper = document.getElementById('private-toggle-wrapper');
  if (repoSelectMode2 === 'template' && privateWrapper) {
    privateWrapper.style.display = 'flex';
  }

  // Private toggle disables + unchecks Pages
  const privateToggle = document.getElementById('private-repo-toggle');
  const pagesToggle = document.getElementById('enable-pages-toggle');
  if (privateToggle && pagesToggle) {
    privateToggle.addEventListener('change', function() {
      if (this.checked) {
        pagesToggle.checked = false;
        pagesToggle.disabled = true;
        pagesToggle.closest('label').classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        pagesToggle.disabled = false;
        pagesToggle.closest('label').classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });
  }

  // Slug preview — case-sensitive slug (lowercase, hyphens, preserve case of original)
  const nameInputEl = document.getElementById('project-name');
  const slugPreview = document.getElementById('slug-preview');
  function updateSlugPreview() {
    const name = nameInputEl.value;
    if (!name) { slugPreview.textContent = ''; return; }
    const slug = name.trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // strip accents
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-')
      .replace(/^-+/, '')
      .replace(/-+$/, '');
    slugPreview.textContent = slug ? __t('new.project_slug_hint', { slug }) : '';
  }
  nameInputEl.addEventListener('input', updateSlugPreview);
  updateSlugPreview();

  // === Fork destination dropdown ===
  const forkTargetWrapper = document.getElementById('fork-target-wrapper');
  const forkTargetSelect = document.getElementById('fork-target-select');
  const forkExistsModal = document.getElementById('fork-exists-modal');
  const forkExistsClose = document.getElementById('fork-exists-close');

  // Show fork target dropdown + load orgs in template mode
  if (repoSelectMode === 'template' && forkTargetWrapper) {
    forkTargetWrapper.style.display = 'block';
    // Load orgs asynchronously
    if (window.electronAPI && window.electronAPI.listUserOrgs) {
      window.electronAPI.listUserOrgs().then(result => {
        if (result.success && result.orgs && forkTargetSelect) {
          result.orgs.forEach(org => {
            const opt = document.createElement('option');
            opt.value = org.login;
            opt.textContent = __t('new.fork_target_org', { name: org.login });
            forkTargetSelect.appendChild(opt);
          });
        }
      }).catch(err => console.warn('Failed to load orgs:', err));
    }
  }

  // Close fork-exists modal
  if (forkExistsClose) {
    forkExistsClose.addEventListener('click', () => {
      if (forkExistsModal) forkExistsModal.style.display = 'none';
    });
  }

  // Intercept create button to check fork existence first
  const createBtn = document.getElementById('create-project-button');
  if (createBtn) {
    createBtn.addEventListener('click', async function(e) {
      if (sessionStorage.getItem('repoSelectMode') !== 'template') return; // Only in template mode
      // If already checked, let the original handler proceed
      if (createBtn.dataset.forkChecked === 'true') {
        createBtn.dataset.forkChecked = '';
        return;
      }
      e.preventDefault();
      e.stopImmediatePropagation();
      const selectedOrg = forkTargetSelect ? forkTargetSelect.value : '';
      // Compute slug from project name (NFD-stripped) to check target existence
      const nameInput = document.getElementById('project-name');
      const slug = (nameInput && nameInput.value || '').trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-')
        .replace(/^-+/, '')
        .replace(/-+$/, '');
      try {
        const result = await window.electronAPI.checkTemplateTargetExists(selectedOrg || null, slug);
        if (result.exists) {
          if (forkExistsModal) forkExistsModal.style.display = 'flex';
          return; // Don't proceed
        }
      } catch (err) {
        console.warn('Template target check failed:', err);
      }
      // Store selected org for later use
      sessionStorage.setItem('templateTargetOwner', selectedOrg || '');
      // Proceed with original handler
      createBtn.dataset.forkChecked = 'true';
      createBtn.click();
    }, true); // capture phase to run before other handlers
  }
});
</script>

<script src="./shared/theme-init.js" defer></script>
<script>
// --- Theme picker ---
function applyThemeMode(mode) {
    var shouldBeDark;
    if (mode === 'auto') {
        shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    } else {
        shouldBeDark = mode === 'dark';
    }
    document.documentElement.classList.toggle('dark', shouldBeDark);
    document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.theme === mode);
    });
    if (window.electronAPI && window.electronAPI.setThemeMode) {
        window.electronAPI.setThemeMode(mode).then(function (result) {
            if (result && result.css) {
                var el = document.getElementById('__theme_injected');
                if (!el) {
                    el = document.createElement('style');
                    el.id = '__theme_injected';
                    document.head.appendChild(el);
                }
                el.textContent = result.css;
            }
        }).catch(function (e) { console.warn('setThemeMode error:', e); });
    }
}
function initThemePicker() {
    document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            applyThemeMode(btn.dataset.theme);
        });
    });
    if (window.electronAPI && window.electronAPI.getThemeMode) {
        window.electronAPI.getThemeMode().then(function (r) {
            if (r && r.success) {
                var mode = r.mode || 'auto';
                document.querySelectorAll('.theme-btn').forEach(function (btn) {
                    btn.classList.toggle('active', btn.dataset.theme === mode);
                });
            }
        }).catch(function () {});
    } else {
        var isDark = document.documentElement.classList.contains('dark');
        var inferred = isDark ? 'dark' : 'light';
        document.querySelectorAll('.theme-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.theme === inferred);
        });
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initThemePicker);
} else {
    initThemePicker();
}
</script>
