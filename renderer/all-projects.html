<!DOCTYPE html>
<html class="dark" lang="en" data-i18n-document-title="all_projects.page_title"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/png" sizes="64x64" href="./assets/icon-favicon.png"/>
<title>All Projects</title>
<link href="./assets/css/fonts.css" rel="stylesheet"/>
<link href="./assets/css/compiled.css" rel="stylesheet"/>
<link href="./assets/css/theme-override.css" rel="stylesheet"/>
<style>
  /* Theme picker (top-right) */
  .theme-picker {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.5rem;
  }
  .theme-picker-group {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 0.25rem;
      border-radius: 0.5rem;
      background: var(--color-surface-dark);
      border: 1px solid var(--color-border-subtle);
  }
  .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--color-muted-dark, var(--color-text-dark));
  }
  .theme-btn:hover {
      color: var(--color-text-dark);
  }
  .theme-btn.active {
      background: var(--color-surface-card);
      color: var(--color-primary);
  }
  .theme-btn .material-symbols-outlined {
      font-size: 1rem;
  }
  [x-cloak] { display: none !important; }
</style>

<script src="./shared/logo.js"></script>
<script src="./shared/i18n-apply.js"></script>
<script src="./shared/theme-init.js" defer></script>
<script src="./i18n.js"></script>
<script src="script.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Inject logo
    var logoHost = document.getElementById('logo-host');
    if (logoHost && window.Documental && window.Documental.renderLogo) {
      logoHost.innerHTML = window.Documental.renderLogo({ size: 'md' });
    }
    // Apply declarative i18n
    if (window.Documental && window.Documental.applyTranslations) {
      window.Documental.applyTranslations();
    }
  });

// --- Theme picker ---
function applyThemeMode(mode) {
    var shouldBeDark;
    if (mode === 'auto') {
        shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    } else {
        shouldBeDark = mode === 'dark';
    }
    document.documentElement.classList.toggle('dark', shouldBeDark);
    document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.theme === mode);
    });
    if (window.electronAPI && window.electronAPI.setThemeMode) {
        window.electronAPI.setThemeMode(mode).then(function (result) {
            if (result && result.css) {
                var el = document.getElementById('__theme_injected');
                if (!el) {
                    el = document.createElement('style');
                    el.id = '__theme_injected';
                    document.head.appendChild(el);
                }
                el.textContent = result.css;
            }
        }).catch(function (e) { console.warn('setThemeMode error:', e); });
    }
}
function initThemePicker() {
    document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            applyThemeMode(btn.dataset.theme);
        });
    });
    if (window.electronAPI && window.electronAPI.getThemeMode) {
        window.electronAPI.getThemeMode().then(function (r) {
            if (r && r.success) {
                var mode = r.mode || 'auto';
                document.querySelectorAll('.theme-btn').forEach(function (btn) {
                    btn.classList.toggle('active', btn.dataset.theme === mode);
                });
            }
        }).catch(function () {});
    } else {
        var isDark = document.documentElement.classList.contains('dark');
        var inferred = isDark ? 'dark' : 'light';
        document.querySelectorAll('.theme-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.theme === inferred);
        });
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initThemePicker);
} else {
    initThemePicker();
}
</script>
</head>
<body class="bg-background-dark text-text-dark antialiased">
<!-- Theme picker (top-right) -->
<div class="theme-picker">
    <div class="theme-picker-group">
        <button class="theme-btn" data-theme="auto" aria-label="Auto theme">
            <span class="material-symbols-outlined">contrast</span>
        </button>
        <button class="theme-btn" data-theme="dark" aria-label="Dark theme">
            <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <button class="theme-btn" data-theme="light" aria-label="Light theme">
            <span class="material-symbols-outlined">light_mode</span>
        </button>
    </div>
</div>
<div class="flex flex-col h-screen">
<div class="flex-1 flex items-center justify-center p-8">
<div class="w-full max-w-4xl">
<div class="text-center mb-8">
<button class="btn-back" data-navigate="index.html">
<span class="material-symbols-outlined text-base">arrow_back</span>
<span data-i18n="common.back">Back</span>
</button>
<div class="flex items-center justify-center gap-4 mb-4">
<span id="logo-host" class="inline-flex"></span>
<h1 class="text-4xl font-black text-text-dark" data-i18n="all_projects.title">All Projects</h1>
</div>
<p class="text-muted-dark text-lg" data-i18n="all_projects.subtitle">Select a project to continue</p>
</div>

<div class="bg-surface-dark rounded-lg p-6">
<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-semibold text-text-dark" data-i18n="all_projects.project_list">Project List</h2>
<div class="text-sm text-muted-dark" id="projects-count-container">
</div>
</div>
<div class="space-y-3" id="all-projects-container">
<!-- All projects will be loaded dynamically here -->
</div>
</div>
</div>
</div>
</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" style="display: none;">
  <div class="bg-surface-dark rounded-lg shadow-xl p-6 w-full max-w-md">
    <div class="flex items-center gap-3 mb-4">
      <span class="material-symbols-outlined text-red-500 text-2xl">delete</span>
      <h3 class="text-lg font-medium text-text-dark" data-i18n="all_projects.confirm_removal">Confirm Removal</h3>
    </div>
    <p class="text-sm text-muted-dark mb-6" data-i18n="all_projects.confirm_removal_desc">This action cannot be undone.</p>
    <div class="mb-4">
      <p class="text-xs text-muted-dark" data-i18n="all_projects.project_label">Project</p>
      <p id="delete-project-name" class="text-sm font-medium text-text-dark"></p>
    </div>
    <div class="flex justify-end space-x-3">
      <button id="cancel-delete" class="px-4 py-2 text-sm font-medium text-muted-dark bg-surface-secondary rounded-md hover:bg-surface-dark transition-colors duration-200" data-i18n="cancel">Cancel</button>
      <button id="confirm-delete" class="px-4 py-2 text-sm font-medium text-white bg-danger rounded-md hover:bg-danger-dark transition-colors duration-200" data-i18n="all_projects.remove_project">Remove Project</button>
    </div>
  </div>
</div>

</body></html>
