<!DOCTYPE html>
<html class="dark" lang="en" data-i18n-document-title="all_projects.page_title"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>All Projects</title>
<link href="./assets/css/fonts.css" rel="stylesheet"/>
<link href="./assets/css/compiled.css" rel="stylesheet"/>
<link href="./assets/css/theme-override.css" rel="stylesheet"/>

<script src="./shared/logo.js"></script>
<script src="./shared/i18n-apply.js"></script>
<script src="./i18n.js"></script>
<script src="script.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Inject logo
    var logoHost = document.getElementById('logo-host');
    if (logoHost && window.Documental && window.Documental.renderLogo) {
      logoHost.innerHTML = window.Documental.renderLogo({ size: 'md' });
    }
    // Apply declarative i18n
    if (window.Documental && window.Documental.applyTranslations) {
      window.Documental.applyTranslations();
    }
  });
</script>
</head>
<body class="bg-background-dark text-text-dark antialiased">
<div class="flex flex-col h-screen">
<div class="flex-1 flex items-center justify-center p-8">
<div class="w-full max-w-4xl">
<div class="text-center mb-8">
<button class="btn-back" data-navigate="index.html">
<span class="material-symbols-outlined text-base">arrow_back</span>
<span data-i18n="common.back">Back</span>
</button>
<div class="flex items-center justify-center gap-4 mb-4">
<span id="logo-host" class="inline-flex"></span>
<h1 class="text-4xl font-black text-text-dark" data-i18n="all_projects.title">All Projects</h1>
</div>
<p class="text-muted-dark text-lg" data-i18n="all_projects.subtitle">Select a project to continue</p>
</div>

<div class="bg-surface-dark rounded-lg p-6">
<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-semibold text-text-dark" data-i18n="all_projects.project_list">Project List</h2>
<div class="text-sm text-muted-dark" id="projects-count-container">
</div>
</div>
<div class="space-y-3" id="all-projects-container">
<!-- All projects will be loaded dynamically here -->
</div>
</div>
</div>
</div>
</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" style="display: none;">
  <div class="bg-surface-dark rounded-lg shadow-xl p-6 w-full max-w-md">
    <div class="flex items-center gap-3 mb-4">
      <span class="material-symbols-outlined text-red-500 text-2xl">delete</span>
      <h3 class="text-lg font-medium text-text-dark" data-i18n="all_projects.confirm_removal">Confirm Removal</h3>
    </div>
    <p class="text-sm text-muted-dark mb-6" data-i18n="all_projects.confirm_removal_desc">This action cannot be undone.</p>
    <div class="mb-4">
      <p class="text-xs text-muted-dark" data-i18n="all_projects.project_label">Project</p>
      <p id="delete-project-name" class="text-sm font-medium text-text-dark"></p>
    </div>
    <div class="flex justify-end space-x-3">
      <button id="cancel-delete" class="px-4 py-2 text-sm font-medium text-muted-dark bg-surface-secondary rounded-md hover:bg-surface-dark transition-colors duration-200" data-i18n="cancel">Cancel</button>
      <button id="confirm-delete" class="px-4 py-2 text-sm font-medium text-white bg-danger rounded-md hover:bg-danger-dark transition-colors duration-200" data-i18n="all_projects.remove_project">Remove Project</button>
    </div>
  </div>
</div>

</body></html>
