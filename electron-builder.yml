afterPack: ./scripts/flip-fuses.js
extraResources:
  - from: resources/config
    to: config
linux:
  # Snap needs snapcraft installed and arm64 was never a release target;
  # both stay available via explicit CLI overrides (npm run build:linux:snap).
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icons
  category: Development
  # desktopName is a package.json ROOT field (not under linux) in electron-builder 26.15.3;
  # syncDesktopName: true derives the .desktop filename + StartupWMClass from it.
  syncDesktopName: true
  desktop:
    entry:
      Name: Documental
      Comment: Ambiente de documentação centralizado com integração Git
      Keywords: documentation;git;github;development;
  maintainer: Documental Team <team@documental.com>
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: assets/icon-mac.png
  category: public.app-category.developer-tools
snap:
  plugs:
    - default
    - desktop
    - desktop-legacy
    - home
    - x11
    - unity7
    - browser-support
    - network
    - gsettings
    - audio-playback
    - pulseaudio
    - opengl
