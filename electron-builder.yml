appId: com.documental.app
productName: Documental
directories:
  output: dist
extraMetadata:
  env:
    GITHUB_CLIENT_ID:
      $fromFile: electron-builder.env
files:
  - "main.js"
  - "preload.js"
  # Hardening vs minimatch#284 / electron-builder#9621: globstar patterns like
  # `renderer/**/*` silently drop the whole dir from app.asar under the broken
  # minimatch 10.2.3; literal file patterns survive it. Keep when adding pages.
  - "renderer/*.html"
  - "renderer/*.js"
  - "renderer/**/*"
  - "src/**/*"
  - "themes/**/*"
  - "assets/icon.png"
  - "assets/icon.ico"
  - "package.json"
  - "node_modules/**/*"
  - "!node_modules/.cache/**"
  - "!node_modules/.bin/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.txt"
  - "!node_modules/**/CHANGELOG*"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/README*"
asarUnpack:
  - node_modules/sqlite3/**/*
  - node_modules/dugite/git/**/*
  - node_modules/npm/**
# npm bundled deps: electron-builder hoists these from npm/node_modules into
# top-level node_modules inside the asar; unpack so ELECTRON_RUN_AS_NODE children
# spawned outside asar-fs can resolve them.
