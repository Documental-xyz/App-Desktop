appId: com.documental.app
productName: Documental
directories:
  output: dist
files:
  - "main.js"
  - "preload.js"
  - "renderer/**/*"
  - "src/**/*"
  - "themes/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!node_modules/.cache/**"
  - "!node_modules/.bin/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.txt"
  - "!node_modules/**/CHANGELOG*"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/README*"
asarUnpack:
  - node_modules/sqlite3/**/*
  - node_modules/keytar/**/*
extraResources:
  - "resources/**/*"
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: Development
  desktop:
    Name: Documental
    Comment: Ambiente de documentação centralizado com integração Git
    Keywords: documentation;git;github;development;
  maintainer: Documental Team <team@documental.com>
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  sign: false
  signDlls: false
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: public.app-category.developer-tools
snap:
  plugs:
    - default
    - desktop
    - desktop-legacy
    - home
    - x11
    - unity7
    - browser-support
    - network
    - gsettings
    - audio-playback
    - pulseaudio
    - opengl