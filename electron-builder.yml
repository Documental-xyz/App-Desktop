appId: com.documental.app
productName: Documental
directories:
  output: dist
extraMetadata:
  env:
    GITHUB_CLIENT_ID:
      $fromFile: electron-builder.env
files:
  - "main.js"
  - "preload.js"
  - "renderer/**/*"
  - "src/**/*"
  - "themes/**/*"
  - "assets/icon.png"
  - "assets/icon.ico"
  - "package.json"
  - "node_modules/**/*"
  - "!node_modules/.cache/**"
  - "!node_modules/.bin/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.txt"
  - "!node_modules/**/CHANGELOG*"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/README*"
asarUnpack:
  - node_modules/sqlite3/**/*
  - node_modules/keytar/**/*
extraResources:
  - "resources/**/*"
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: Development
  # desktopName is a package.json ROOT field (not under linux) in electron-builder 26.15.3;
  # syncDesktopName: true derives the .desktop filename + StartupWMClass from it.
  syncDesktopName: true
  desktop:
    entry:
      Name: Documental
      Comment: Ambiente de documentação centralizado com integração Git
      Keywords: documentation;git;github;development;
  maintainer: Documental Team <team@documental.com>
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon-mac.png
  category: public.app-category.developer-tools
snap:
  plugs:
    - default
    - desktop
    - desktop-legacy
    - home
    - x11
    - unity7
    - browser-support
    - network
    - gsettings
    - audio-playback
    - pulseaudio
    - opengl